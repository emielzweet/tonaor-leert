<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leren">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Leren</title>
<meta name="theme-color" content="#f4f6f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
/* Layout: één smalle app-kolom voor de iPhone, vaste balk onderin, één taak per scherm.
   Palet: rustige pastels. Mint = groei, abrikoos = hoofdknop, hemelsblauw = water/herhalen en Engels, lila = bloemen. Geen rood. */
:root{
  --bg:#f4f6f1; --surface:#fdfdfb; --surface-2:#eceee6; --ink:#2c3833; --ink-2:#66736c; --line:#dde3d8;
  --mint:#dcefe4; --mint-fill:#a9d5bd; --mint-ink:#3e7b5d;
  --apricot:#fbefd9; --apricot-fill:#f3d89f; --apricot-ink:#8a6220;
  --sky:#e2eef7; --sky-fill:#b6d4ea; --sky-ink:#3c6d8e;
  --lilac:#eee9f7; --lilac-fill:#d2c7ec; --lilac-ink:#6c5d98;
  --shadow:0 1px 2px rgba(44,56,51,.05), 0 8px 24px -16px rgba(44,56,51,.18);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-thai:"IBM Plex Sans Thai Looped","Thonburi","Leelawadee UI","Noto Sans Thai",sans-serif;
  --r:22px; --r-s:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1f1d; --surface:#242b28; --surface-2:#2d3531; --ink:#e8eee9; --ink-2:#a8b5ad; --line:#38423d;
  --mint:#24392e; --mint-fill:#4e7c65; --mint-ink:#a6d8bd;
  --apricot:#372f20; --apricot-fill:#9b7c45; --apricot-ink:#f0d39c;
  --sky:#213443; --sky-fill:#4c7290; --sky-ink:#b0d1ea;
  --lilac:#2e2a3d; --lilac-fill:#6a5d92; --lilac-ink:#cec2ec;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 28px -16px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1f1d; --surface:#242b28; --surface-2:#2d3531; --ink:#e8eee9; --ink-2:#a8b5ad; --line:#38423d;
  --mint:#24392e; --mint-fill:#4e7c65; --mint-ink:#a6d8bd;
  --apricot:#372f20; --apricot-fill:#9b7c45; --apricot-ink:#f0d39c;
  --sky:#213443; --sky-fill:#4c7290; --sky-ink:#b0d1ea;
  --lilac:#2e2a3d; --lilac-fill:#6a5d92; --lilac-ink:#cec2ec;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 28px -16px rgba(0,0,0,.6); color-scheme:dark}
:root[data-size="groot"]{font-size:112%}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
.app{max-width:560px;margin:0 auto;padding-block:10px 124px}
.app.sess{padding-bottom:40px}
.view{display:flex;flex-direction:column;gap:16px;animation:in .28s ease both}
@keyframes in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em;line-height:1.15}
h1{font-size:1.9rem;font-weight:800} h2{font-size:1.35rem;font-weight:700} h3{font-size:1.06rem;font-weight:700}
p{margin:0}
button,a.btn{font:inherit;color:inherit;cursor:pointer;text-decoration:none}
button:active{transform:scale(.98)}
:focus-visible{outline:3px solid var(--sky-fill);outline-offset:2px;border-radius:10px}
.sup{color:var(--ink-2);font-size:.9em;line-height:1.5;display:block;font-weight:400}
:lang(th){font-family:var(--f-thai)}
:root[data-thai="uit"] .sup{display:none!important}
:root[data-thai="tik"] .bi .sup{display:none}
:root[data-thai="tik"] .bi.show .sup{display:block}
.muted{color:var(--ink-2)} .small{font-size:.86rem} .num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
button.card{width:100%;text-align:left}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
@media (max-width:480px){.grid2.stack-sm{grid-template-columns:1fr}}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:8px}
.top>div{min-width:0}
.thai-switch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex-shrink:0}
.thai-switch button{border:0;background:transparent;padding:7px 11px;font-size:.78rem;font-weight:700;color:var(--ink-2)}
.thai-switch button[aria-pressed="true"]{background:var(--mint-fill);color:var(--ink)}
.hero{background:var(--mint);border:0;position:relative;overflow:hidden;padding:20px}
.hero .art{position:absolute;right:-6px;top:-4px;width:140px;height:120px;pointer-events:none}
.hero h2{font-size:1.5rem}
.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;position:relative}
.steps li{display:flex;align-items:center;gap:10px;font-size:.96rem}
.steps .dot{width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.8rem;font-weight:800;flex-shrink:0;color:var(--mint-ink)}
.steps .min{margin-left:auto;color:var(--ink-2);font-size:.85rem;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:18px;border:0;font-weight:700;font-size:1.06rem;padding:10px 16px;text-align:center;transition:transform .1s ease}
.btn .bi{display:flex;flex-direction:column;align-items:center}
.btn .sup{font-size:.82em}
.btn svg{width:20px;height:20px}
.btn-main{background:var(--apricot-fill);color:var(--ink)}
.btn-leaf{background:var(--mint-fill);color:var(--ink)}
.btn-sky{background:var(--sky-fill);color:var(--ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linkish{background:none;border:0;padding:8px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:.95rem;width:100%;text-align:center}
.hero .btn-main{margin-top:16px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:grid;gap:6px;box-shadow:var(--shadow);min-width:0;align-content:start}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile h3{font-size:1rem}
.tile.mint .ic{background:var(--mint);color:var(--mint-ink)} .tile.sky .ic{background:var(--sky);color:var(--sky-ink)}
.tile.apricot .ic{background:var(--apricot);color:var(--apricot-ink)} .tile.lilac .ic{background:var(--lilac);color:var(--lilac-ink)}
.tile.wide{grid-template-columns:auto 1fr;align-items:center;gap:12px;border-color:var(--sky-fill)}
.flag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:2px 6px;background:var(--sky);color:var(--sky-ink);vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;white-space:nowrap;border:0}
.pill-mint{background:var(--mint);color:var(--mint-ink)} .pill-sky{background:var(--sky);color:var(--sky-ink)}
.pill-apricot{background:var(--apricot);color:var(--apricot-ink)} .pill-lilac{background:var(--lilac);color:var(--lilac-ink)}
.week{display:flex;justify-content:space-between;gap:4px;margin-top:10px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--ink-2);font-weight:700}
.day i{width:26px;height:26px;border-radius:50%;display:block;border:2px solid var(--line)}
.day.done i{background:var(--mint-fill);border-color:var(--mint-fill)}
.day.today i{border-color:var(--apricot-fill);border-width:3px}
.ring{width:80px;height:80px;flex-shrink:0}
.goal-pick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.goal-pick button,.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600}
.goal-pick button[aria-pressed="true"],.chips button[aria-pressed="true"]{border-color:var(--apricot-fill);background:var(--apricot)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));z-index:20}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.78rem;font-weight:700;color:var(--ink-2)}
.nav button .sup{font-size:.68rem}
.nav button[aria-current="page"]{color:var(--mint-ink)}
.nav button[aria-current="page"] svg{background:var(--mint);border-radius:10px}
.nav svg{width:44px;height:28px;padding:3px 10px}
.sess-top{display:flex;align-items:center;gap:12px;padding-top:6px}
.close{border:0;background:var(--surface-2);width:42px;height:42px;border-radius:50%;font-size:1.2rem;flex-shrink:0;color:var(--ink)}
.bar{flex:1;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint-fill);border-radius:999px;transition:width .45s ease}
.stage-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prompt{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.25}
.prompt.sp{font-weight:600}
.input{width:100%;min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.2rem;padding:10px 14px}
.input:focus{border-color:var(--mint-fill);outline:none}
textarea.input{min-height:90px;font-size:1rem;resize:vertical}
.speak{border:0;background:var(--sky);color:var(--sky-ink);border-radius:999px;padding:9px 14px;font-weight:700;font-size:.9rem;display:inline-flex;gap:8px;align-items:center}
.speak svg{width:16px;height:16px;flex-shrink:0}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:4px;animation:in .2s ease both}
.fb-ok{background:var(--mint)} .fb-ok strong{color:var(--mint-ink)}
.fb-no{background:var(--apricot)} .fb-no strong{color:var(--apricot-ink)}
.pieces{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border-radius:16px;border:2px dashed var(--line);align-content:flex-start}
.pieces.pool{border-style:solid;background:var(--surface-2);border-color:transparent}
.piece{border:0;background:var(--surface);border-radius:12px;padding:10px 14px;font-size:1.05rem;font-weight:600;box-shadow:0 0 0 1.5px var(--line) inset}
.piece.verb{box-shadow:0 0 0 2px var(--apricot-fill) inset;background:var(--apricot)}
.example{background:var(--surface-2);border-radius:var(--r-s);padding:12px 14px;display:grid;gap:4px}
.slot{display:inline-block;border-radius:8px;padding:1px 7px;margin:0 1px;font-weight:700}
.s1{background:var(--sky);color:var(--sky-ink)} .s2{background:var(--apricot);color:var(--apricot-ink)} .s3{background:var(--mint);color:var(--mint-ink)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.one{grid-template-columns:1fr}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:16px;min-height:64px;font-size:1.12rem;font-weight:700;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.choice.right{border-color:var(--mint-fill);background:var(--mint)}
.choice.wrong{border-color:var(--apricot-fill);background:var(--apricot)}
.note{background:var(--apricot);border-radius:var(--r-s);padding:12px 14px;font-size:.94rem}
.note.sky{background:var(--sky)} .note.lilac{background:var(--lilac)}
.receipt{font-family:ui-monospace,"SF Mono",Menlo,monospace;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;font-size:.95rem;max-width:300px;margin-inline:auto;width:100%;box-shadow:var(--shadow)}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
.worked{display:grid;gap:8px}
.worked .ln{display:flex;gap:10px;align-items:baseline}
.worked .ln b{color:var(--mint-ink);min-width:22px}
.hint-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hintbtn{border:1.5px dashed var(--lilac-fill);background:var(--lilac);color:var(--lilac-ink);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.85rem}
.hintbtn .bi{display:inline}
.hintshow{font-weight:700;color:var(--lilac-ink)}
.help{border:0;background:none;color:var(--ink-2);font-weight:600;font-size:.88rem;text-decoration:underline;text-underline-offset:3px;padding:6px 0;text-align:left}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coins{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:8px 0}
.coin{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;background:var(--apricot);border:3px solid var(--apricot-fill);color:var(--apricot-ink)}
.coin.small{width:48px;height:48px;font-size:.8rem}
.bill{width:96px;height:56px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:var(--mint);border:2px solid var(--mint-fill);color:var(--mint-ink)}
.clock{width:150px;height:150px;margin:0 auto;display:block}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.trio>div{background:var(--surface-2);border-radius:var(--r-s);padding:10px 6px;display:grid;gap:2px;min-width:0}
.trio .lg{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.trio .wd{font-weight:700;font-size:1.04rem;overflow-wrap:anywhere}
.story .sent{display:block;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:1.1rem;line-height:1.55}
.story .sent:last-child{border-bottom:0}
.speed{font-family:var(--f-display);font-size:3rem;font-weight:800;text-align:center;line-height:1.05;overflow-wrap:anywhere}
.timer{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--sky-fill);transition:width 1s linear}
.big{font-family:var(--f-display);font-size:3.2rem;font-weight:800;color:var(--mint-ink);line-height:1}
.celebrate{text-align:center;display:grid;gap:12px;justify-items:center}
.wordcard{display:grid;gap:8px;text-align:center;justify-items:center;padding:10px 0}
.wordcard .art{font-weight:800;font-size:.9rem;border-radius:999px;padding:3px 12px}
.art-de{background:var(--sky);color:var(--sky-ink)} .art-het{background:var(--lilac);color:var(--lilac-ink)}
.wordcard .w{font-family:var(--f-display);font-size:2.2rem;font-weight:800;overflow-wrap:anywhere}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.plant{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.plant svg{width:64px;height:64px}
.plant .w{font-weight:700;font-size:.88rem;line-height:1.2;overflow-wrap:anywhere}
.plant .sup{font-size:.74rem}
.plant.thirsty{border-color:var(--sky-fill);background:var(--sky)}
.bed{display:grid;gap:10px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.route{display:grid;padding-left:4px}
.stn{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;position:relative;padding-bottom:18px}
.stn:not(:last-child)::before{content:"";position:absolute;left:18px;top:32px;bottom:-2px;width:3px;background:var(--line);border-radius:2px}
.stn.done:not(:last-child)::before{background:var(--mint-fill)}
.stn .mk{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:var(--surface);border:3px solid var(--line);position:relative;z-index:1}
.stn.done .mk{background:var(--mint-fill);border-color:var(--mint-fill)}
.stn.now .mk{border-color:var(--apricot-fill);background:var(--apricot)}
.stn.gate .mk{border-radius:11px;transform:rotate(45deg)}
.stn.gate .mk span{transform:rotate(-45deg)}
.stn .tx{padding-top:6px;display:grid;gap:2px;min-width:0}
.skill{display:grid;grid-template-columns:96px 1fr 42px;gap:10px;align-items:center;font-size:.92rem}
.track{height:12px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:999px}
.list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.list li{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0;padding-bottom:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{border-color:var(--mint-fill);background:var(--mint)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:30;max-width:calc(100% - 32px);text-align:center}
#petals{position:fixed;inset:0;pointer-events:none;z-index:40}
.onb-art{width:100%;max-width:340px;margin:0 auto;display:block}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:6px;background:var(--line)}
.dots i.on{background:var(--mint-fill);width:22px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<main class="app" id="app" aria-live="polite"></main>
<nav class="nav" id="nav" aria-label="Hoofdmenu" hidden><div class="nav-in">

/* S is een let verderop: vóór het laden (TDZ) gooit zelfs typeof S een fout, daarom try */
function curS(){try{return S}catch(e){return null}}
function learnL(){const s=curS();return (s&&LEARN.includes(s.learn)&&s.learn)||'nl'}
function supL(){const s=curS();return (s&&SUPPORT.includes(s.sup)&&s.sup)||'th'}
function tr(key,lang,vars){const tb=I18N[lang]||{};let s=tb[key+'@'+supL()];if(s==null)s=tb[key];if(s==null)return null;
  if(typeof s==='object')s=(vars&&vars.n===1?s.one:s.other)??s.other;
  const v=Object.assign({sup:(LANG[supL()].name[lang]||'')},vars||{});return String(s).replace(/\{(\w+)\}/g,(m,k)=>k in v?(typeof v[k]==='function'?v[k](lang):v[k]):m)}
function t(key,vars){return tr(key,learnL(),vars)??tr(key,'en',vars)??key}
function ts(key,vars){const P=supL();return P===learnL()?'':(tr(key,P,vars)??'')}
const strip=s=>String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
function supAttr(){const L=LANG[supL()];return `lang="${L.tag}"${L.dir==='rtl'?' dir="rtl"':''}`}
/* bi(leertaal, steuntaal): de steuntaalregel valt weg als hij leeg is of gelijk aan de leertaal (bijv. Engelse les met steuntaal Engels). */
const bi=(a,b)=>`<span class="bi"><span class="nl">${a}</span>${b&&strip(b)!==strip(a)?`<span class="sup" ${supAttr()}>${b}</span>`:''}</span>`;
function T(key,vars){return bi(t(key,vars),ts(key,vars))}
/* platte tekst voor meldingen: "leertaal · steuntaal" (in de NL-stand alleen leertaal) */
function tx(key,vars){const a=strip(t(key,vars)),b=strip(ts(key,vars));return a+(b&&b!==a&&!nlOnly()?' · '+b:'')}
/* knoplabel: leertaal + steuntaalregel, zonder .bi-omhulling */
function TB(key,vars){const a=t(key,vars),b=ts(key,vars);return a+(b&&strip(b)!==strip(a)?`<span class="sup" ${supAttr()}>${b}</span>`:'')}
/* inhoud: vertaling in de steuntaal. L_(x) = x.th / x.en; L_(x,'why') = x.whyTh / x.whyEn. M_(x,'why') = leertaaltekst, met variant x['why@en'] voor steuntaal en. */
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function L_(x,f){if(!x)return '';const P=supL(),v=f?x[f+cap(P)]:x[P];return v==null?'':v}
function M_(x,f){return x?(x[f+'@'+supL()]??x[f]??''):''}

/* koppelcodes: S.code = oude TL1-code, S.code2 = sterke TL2-code, S.v2seen = laatste hello van de EDGE op TL2.

const TLS=window.TLSync||null;

function ensureCodes(){if(S.v2ok&&!S.v2seen){S.v2seen=Date.now()}delete S.v2ok;if(S.v2seen)S.tl1off=true;if(!TLS)return;if(TLS.secure()){if(!S.code2){S.code2=TLS.newCode2()}}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(S.code2)TLS.prepare(S.code2)}
ensureCodes();

function thirsty(id){const it=S.items[id];return !!it&&it.reps>0&&it.due<=now()&&stage(id)<5}
function review(id,ok,form){
  const it=S.items[id];if(!it)return;
  if(form&&!it.forms.includes(form))it.forms.push(form);
  it.reps++;
  if(ok){it.s=it.s<=0?1:Math.min(120,it.s*2.4);if(it.forms.length<3&&it.s>=10)it.s=9}
  else{it.lapses++;it.s=Math.max(.5,it.s*.4)}
  it.due=ok?now()+it.s*DAY:now();
  S.log.push({t:now(),id,ok});if(S.log.length>600)S.log.shift();
  save();
}

/* ============ voorlezen ============
   Altijd een stem in de juiste taal: de gekozen stem (Ik → Voorlezen), anders de beste voor nl-NL (natuurlijk/verbeterd eerst, nl-BE pas daarna).
   Kent de browser wél stemmen maar geen enkele in deze taal, dan leest de app NIET voor met een anderstalige stem (dat leert een verkeerde
   uitspraak aan) en legt Ik → Voorlezen uit hoe je er een installeert.
   Geeft de browser géén lijst (besluiten Emiel 12 nov 2026):
   - iPhone/iPad: meteen voorlezen met alleen de taal (nl-NL). iOS geeft in de beginscherm-app soms geen lijst, maar kiest op taal wel
     zijn eigen Nederlandse stem. Meteen, zodat het nog als reactie op een tik telt (anders blokkeert iOS het geluid).
   - Elders: eventjes wachten tot de stemmen geladen zijn en dan alleen de laatste tekst voorlezen. Blijft de lijst leeg, dan niet
     voorlezen: het systeem zou zelf een stem kiezen, vaak een Engelse (zo ging het mis in het voorbeeldvenster van de Claude-app). */
const LANGS={nl:{tag:'nl-NL',re:/^nl/i,main:/^nl[-_]NL/i,adj:'Nederlandse'},en:{tag:'en-GB',re:/^en/i,main:/^en[-_]GB/i,adj:'Engelse'}};
function isIOS(){try{return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}catch(e){return false}}
let allVoices=[];const voiceWarned={};
function loadVoices(){try{allVoices=speechSynthesis.getVoices()||[]}catch(e){allVoices=[]}return allVoices}
function voiceScore(v,L){let s=0;if(L.main.test(v.lang))s+=100;if(/natural|neural|premium|enhanced|verbeterd|online|google/i.test(v.name))s+=50;if(/compact|novelty|eloquence/i.test(v.name+' '+(v.voiceURI||'')))s-=40;if(v.localService)s+=5;return s}
function voicesFor(lang){const L=LANGS[lang]||LANGS.nl;return loadVoices().filter(v=>L.re.test(v.lang)).sort((a,b)=>voiceScore(b,L)-voiceScore(a,L))}
function voiceFor(lang){const vs=voicesFor(lang),want=S.voice&&S.voice[lang];return (want&&vs.find(v=>(v.voiceURI||v.name)===want))||vs[0]||null}
function noVoice(lang){return loadVoices().length>0&&!voicesFor(lang).length}
try{speechSynthesis.onvoiceschanged=()=>{loadVoices();try{if(tab==='ik'&&!route&&!app.classList.contains('sess'))vMe()}catch(e){}};loadVoices()}catch(e){}
let voiceWait=null,voicePend=null;
function speakNow(t,slow,lang,v){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LANGS[lang].tag;if(v)u.voice=v;u.rate=slow?.68:.9;speechSynthesis.speak(u)}
function say(t,slow,lang,waited){lang=LANGS[lang]?lang:'nl';const L=LANGS[lang];
  if(typeof speechSynthesis==='undefined'||typeof SpeechSynthesisUtterance==='undefined'){if(!voiceWarned.api){voiceWarned.api=1;toast('Voorlezen werkt niet in deze browser.')}return}
  try{
  if(!loadVoices().length){
    if(isIOS())return speakNow(t,slow,lang,null);
    if(!waited&&!voiceWarned.none){const first=!voicePend;voicePend={t,slow,lang};
      if(first){const go=ev=>{if(ev&&!loadVoices().length)return;clearTimeout(voiceWait);speechSynthesis.removeEventListener('voiceschanged',go);const p=voicePend;voicePend=null;if(p)say(p.t,p.slow,p.lang,true)};
        speechSynthesis.addEventListener('voiceschanged',go);voiceWait=setTimeout(go,900)}return}
    if(!voiceWarned.none){voiceWarned.none=1;toast(tx('voice.noneHere'))}return}
  if(noVoice(lang)){if(!voiceWarned[lang]){voiceWarned[lang]=1;toast(`Geen ${L.adj} stem op dit toestel. Zie Ik → Voorlezen.`)}return}
  speakNow(t,slow,lang,voiceFor(lang))}catch(e){toast('Voorlezen werkt niet in deze browser.')}}
function voiceCard(){const vs=voicesFor('nl'),cur=voiceFor('nl');
  return `<section class="card stack">${T('voice.title')}
  ${vs.length?`<label class="small muted" for="vsel">${T('voice.dutchVoice')}</label><select id="vsel" class="input">${vs.map(v=>`<option value="${esc(v.voiceURI||v.name)}"${v===cur?' selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('')}</select>`
   :noVoice('nl')?`<div class="note">${T('voice.none')}</div>`
   :isIOS()?`<p class="small muted">${T('voice.deviceChooses')}</p>`:`<p class="small muted">${T('voice.notLoaded')}</p>`}

  if(st===0)g+=`<ellipse cx="32" cy="44" rx="4.5" ry="3.2" fill="var(--apricot-fill)"/>`;
  if(st>=1){const h=[0,8,15,21,25,27][st],top=45-h;

    g+=`<path d="M32 ${45-h*.45}c-6-1-9-5-9-9 5 0 9 3 9 9z" fill="var(--mint-fill)"/>`;
    if(st>=2)g+=`<path d="M32 ${45-h*.72}c6-1 9-5 9-9-5 0-9 3-9 9z" fill="var(--mint-fill)"/>`;

    if(st===5){for(let i=0;i<8;i++){const a=i*Math.PI/4,cx=(32+Math.cos(a)*6.5).toFixed(1),cy=(top-4+Math.sin(a)*6.5).toFixed(1);g+=`<ellipse cx="${cx}" cy="${cy}" rx="4.3" ry="3.3" transform="rotate(${i*45} ${cx} ${cy})" fill="var(--lilac-fill)"/>`}g+=`<circle cx="32" cy="${top-4}" r="3.8" fill="var(--apricot-fill)"/>`}
  }

/* ============ sessie-raamwerk ============ */
let Q=[],qi=0,sp=0,grown=[],sessName='',sessStart=0,sessRight=0,sessTotal=0;
function runSession(name,queue){Q=queue;qi=0;sp=0;grown=[];sessName=name;sessStart=now();sessRight=0;sessTotal=0;$('#nav').hidden=true;app.classList.add('sess');window.scrollTo(0,0);step()}
function frame(inner,label,stepNo,ofN){
  const p=Math.round(qi/Math.max(1,Q.length-1)*100);
  paint(`<div class="sess-top"><button class="close" id="quit" aria-label="Stoppen">×</button><div class="bar" role="progressbar" aria-label="Voortgang" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>${thaiSwitch()}</div>
  <div class="stage-label"><span class="eyebrow">${stepNo?`Stap ${stepNo} van ${ofN||5} · `:''}${label}</span><span class="pill pill-apricot num">+${sp}</span></div>${inner}`);
  $('#quit').onclick=()=>{finishTime();if(sp>0)toast('Opgeslagen. Je punten blijven staan.');show('vandaag')};
  // #22: onthoud of er al iets met deze vraag gedaan is; dan tekent een taalwissel hem niet opnieuw (geen dubbele punten, geen reset van pogingen)
  const q=Q[qi],v=app.querySelector('.view');if(q&&v){const t=e=>{if(!e.target.closest('button[data-thai],#quit'))q._t=1};v.addEventListener('click',t,true);v.addEventListener('input',t,true)}
}
function finishTime(){const m=Math.max(1,Math.round((now()-sessStart)/6e4));S.mins[today()]=(S.mins[today()]||0)+m;save();syncUp(true)}
function next(){qi++;window.scrollTo(0,0);step()}
function step(){voicePend=null;const q=Q[qi];if(!q)return show('vandaag');H[q.type](q)}
function score(ok,n,part){sessTotal++;if(ok){sessRight++;sp+=n;addPts(n)}else if(part>0){sp+=part;addPts(part)}}
/* fbBox(ok, tekst in de leertaal, tekst in de steuntaal); fbK(ok, sleutel, variabelen) haalt beide uit I18N */
function fbBox(ok,msg,msgSup){const k=ok?'fb.ok':'fb.no',s=ts(k);return `<div class="fb ${ok?'fb-ok':'fb-no'}" role="status"><strong>${t(k)}${nlOnly()||!s?'':` <span ${supAttr()}>${s}</span>`}</strong>${msg?bi(msg,msgSup||''):''}</div>`}
function fbK(ok,k,vars){return fbBox(ok,t(k,vars),ts(k,vars))}
const supSpan=(s,st)=>s?`<span class="sup" ${supAttr()}${st?` style="${st}"`:''}>${s}</span>`:'';
const helpBtn=ctx=>`<button class="help" data-help="${esc(ctx)}">${T('help.ask')}</button>`;

const H={};
H.card=q=>{frame(`<div class="card stack" style="padding:22px">${typeof q.html==='function'?q.html():q.html}</div>${nextBtn(q.btn)}`,q.label,q.step);if(q.bind)q.bind();$('#nx').onclick=next};
H.learn=q=>{const w=q.w;
  frame(`<div class="card wordcard"><span class="art art-${w.art}">${w.art}</span><span class="w">${esc(w.w)}</span>${supSpan(L_(w),'font-size:1.15rem')}<p class="muted">${esc(w.ex)}</p>${speakBtns('sp','sps')}</div>
  <p class="small muted">${T('learn.artTip',{art:w.art})}</p>${nextBtn()}`,'Nieuw woord',q.step);
  setTimeout(()=>say(`${w.art} ${w.w}`),250);$('#sp').onclick=()=>say(`${w.art} ${w.w}. ${w.ex}`);$('#sps').onclick=()=>say(`${w.art} ${w.w}`,true);
  $('#nx').onclick=()=>{if(!S.introduced.includes(w.id))S.introduced.push(w.id);const it=S.items[w.id];it.reps=Math.max(1,it.reps);it.due=now();save();next()};
};
H.recog=q=>{const w=q.w;let first=true;const g=nlOnly()?gapEx(w):null,others=NL.filter(x=>x.id!==w.id&&!(g&&(w.also||[]).includes(x.id))),opts=shuffle([w,...shuffle(others).slice(0,2)]);
  frame(`<div class="card stack">${g?`<p class="eyebrow">Welk woord past?</p><p class="prompt">${g}</p>`:nlOnly()?`<p class="eyebrow">Welk woord hoor je?</p>${speakBtns('sp','sps')}`:`<p class="eyebrow">Welk woord is dit?</p><p class="prompt sp" ${supAttr()}>${L_(w)}</p>`}
  <div class="choices one">${opts.map(o=>`<button class="choice" data-id="${o.id}">${g?'':o.art+' '}${esc(o.w)}</button>`).join('')}</div><div id="fb"></div></div>`,'Herkennen',q.step);
  if(nlOnly()&&!g){setTimeout(()=>say(`${w.art} ${w.w}`),250);$('#sp').onclick=()=>say(`${w.art} ${w.w}`);$('#sps').onclick=()=>say(`${w.art} ${w.w}`,true)}
  app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const ok=b.dataset.id===w.id;b.classList.add(ok?'right':'wrong');
    if(ok){score(first,5);review(w.id,first,'herkennen');if(first)grown.push(w.id);say(g?gapFull(w):`${w.art} ${w.w}`);$('#fb').innerHTML=fbBox(true,g?`<b>${w.art} ${esc(w.w)}</b>. ${esc(gapFull(w))}`:'','')+nextBtn();$('#nx').onclick=next}

function startSpeed(){

    <div class="card stack" style="text-align:center">${started?`<p class="eyebrow">de of het?</p><p class="speed">${esc(cur.w)}</p>${supSpan(L_(cur))}
    <div class="choices"><button class="choice" data-a="de">de</button><button class="choice" data-a="het">het</button></div><p class="num muted">${T('speed.good',{n:good})}</p>`
    :`${T('speed.title')}<p>${T('speed.tip')}</p><p class="num">${T('speed.yourRecord',{n:S.speedBest})}</p><button class="btn btn-main" id="go">${T('btn.start')}</button>`}</div>`);
    $('#quit').onclick=()=>{clearInterval(timer);show('vandaag')};
    if($('#go'))$('#go').onclick=()=>{started=true;cur=pick();timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);end()}else{const t=document.querySelector('.timer i');if(t)t.style.width=(left/60*100)+'%';const p=$('#sec');if(p)p.textContent=left+'s'}},1000);draw()};
    app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(b.dataset.a===cur.art)good++;else toast(`${cur.art} ${cur.w}`);let n=pick();while(n===cur)n=pick();cur=n;draw()});
  };
  const end=()=>{const rec=good>S.speedBest;if(rec)S.speedBest=good;addPts(good*2);save();
    paint(`<div class="card celebrate"><div class="big num">${good}</div>${T(rec?'speed.newRecord':'speed.nice')}<p class="muted num">${T('speed.record',{n:S.speedBest})}</p></div><button class="btn btn-main" id="home">${T('btn.back')}</button>`);
    if(rec&&good>0)petals();$('#home').onclick=()=>show('vandaag')};
  draw();
}

  const sk=lv?{nl:Math.min(1,((lv.woorden+lv.grammatica+lv.luisteren+lv.lezen)/4)*.6+mastered(NL.map(x=>x.id))*.4),rk:Math.min(1,lv.rekenen*.7+mastered(REK.map(x=>x.id))*.3),en:Math.min(1,lv.engels*.7+mastered(EN.map(x=>x.id))*.3)}:{nl:mastered(NL.map(x=>x.id)),rk:mastered(REK.map(x=>x.id)),en:mastered(EN.map(x=>x.id))};
  const r=v=>Math.round(v*100)/100,mon=today()-((new Date().getDay()+6)%7)*DAY,days=[],seen=[...NL,...EN,...REK].map(x=>x.id).filter(id=>S.items[id].reps>0),garden=[0,0,0,0,0,0];
  for(let i=0;i<7;i++)days.push(S.days[mon+i*DAY]?1:0);seen.forEach(id=>garden[stage(id)]++);
  const allW=[...NL.map(x=>({id:x.id,l:`${x.art} ${x.w}`})),...EN.map(x=>({id:x.id,l:x.w})),...REK.map(x=>({id:x.id,l:x.label}))];
  return {app:'tonaor-leert',v:1,t:now(),fase:'Fase 1',thema:'Thema 1 · Werk en dagelijks leven',placed:!!S.placement,
    skills:{nl:r(sk.nl),rk:r(sk.rk),en:r(sk.en)},week:{days,mins:Object.entries(S.mins).filter(([d])=>+d>=mon).reduce((a,[,m])=>a+m,0)},
    talks:S.talks,sessions:S.sessions,points:pts(),garden,thirsty:seen.filter(id=>thirsty(id)).length,
    leeches:leeches().map(id=>(allW.find(a=>a.id===id)||{l:id}).l),
    help:S.help.slice(0,10).map(h=>({t:h.t,ctx:h.ctx,open:h.open})),
    seen:S.answers.map(a=>a.id).filter(Boolean).slice(0,40),
    writing:S.log.filter(l=>l.video||l.diary).slice(-3).reverse().map(l=>({t:l.t,kind:l.video?'video':'dagboek',text:l.video||l.diary}))};
}
async function sendProgress(){
  const txt=JSON.stringify(progressData()),d=new Date(),name=`voortgang-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.json`;
  const done=()=>{S.unsent=false;save();toast(tx('help.sent'));rerender()};
  try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Voortgang'+(nmText()?' van '+nmText():'')});return done()}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();done()}catch(e){toast('Delen lukt hier niet. Probeer het in de iPhone-app.')}
}

/* ============ automatische koppeling (versleuteld, via TLSync) ============ */
let upT=null,upBusy=false;
/* koppelingen waarover we versturen: altijd de sterke TL2-code; de oude TL1-code alleen tot de EDGE TL2 bevestigt (hello) */
function syncCodes(){const c=[];if(!TLS)return c;if(S.code2)c.push(S.code2);if(S.code&&!S.tl1off)c.push(S.code);return c}
function syncText(){if(!TLS)return T('sync.noAuto');if(!syncCodes().length)return T('sync.noCode');return S.lastSync?T('sync.last',{when:l=>new Date(S.lastSync).toLocaleString(l==='th'?'th-TH':l==='en'?'en-GB':'nl-NL',{weekday:'short',hour:'2-digit',minute:'2-digit'})}):T('sync.nothing')}
function syncUp(now_,cb){clearTimeout(upT);upT=setTimeout(()=>{if(upBusy){return syncUp(false,cb)}const cs=syncCodes();if(!cs.length)return cb&&cb(false);upBusy=true;const data=progressData();let left=cs.length,any=false,all=true;const done=ok=>{any=any||ok;all=all&&ok;if(--left)return;upBusy=false;if(any){S.lastSync=now();if(all)S.unsent=false;else S.unsent=true;save()}cb&&cb(any)};cs.forEach(c=>{try{TLS.send(c,'up',data,done)}catch(e){done(false)}})},now_?50:4000)}
function gotDown(list,isV2){if(!list)return;let added=0,hello=false;list.forEach(a=>{if(a&&a.type==='hello'&&isV2){hello=true;return}if(!a||!a.id||S.answers.some(x=>x.id===a.id))return;S.answers.unshift({id:a.id,t:a.t||now(),ctx:a.ctx||'',text:a.text||'',seen:false});const h=S.help.find(x=>x.t===a.helpT);if(h)h.open=false;added++});
  if(hello){const was=v2live();S.v2seen=now();S.tl1off=true;save();if(!was)if(tab==='ik'&&!route&&!app.classList.contains('sess'))rerender()}
  if(added){save();syncUp();if(!route&&(tab==='vandaag'||tab==='ik')&&!app.classList.contains('sess'))rerender()}}
function syncDown(){syncCodes().forEach(c=>{try{TLS.fetchAll(c,'down',list=>gotDown(list,TLS.isV2(c)))}catch(e){}})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncDown();else if(S.unsent||!S.lastSync||now()-S.lastSync>36e5)syncUp(true)});
setInterval(()=>{if(document.visibilityState==='visible')syncDown()},90000);
setTimeout(()=>{syncDown();if(!S.lastSync||now()-S.lastSync>6*36e5)syncUp(true)},1500);

/* ============ viering ============ */
function petals(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#petals'),x=c.getContext('2d'),dpr=window.devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement),col=['--apricot-fill','--mint-fill','--lilac-fill','--sky-fill'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:44},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,r:4+Math.random()*5,v:1.4+Math.random()*2.2,a:Math.random()*6,c:col[Math.floor(Math.random()*4)]}));
  let f=0;(function tick(){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.a+=.05)*1.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.beginPath();x.ellipse(0,0,p.r,p.r*.55,0,0,7);x.fill();x.restore()});if(++f<170)requestAnimationFrame(tick);else x.clearRect(0,0,innerWidth,innerHeight)})();
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
}

setThai(S.thai||'altijd');setSize(S.size||'normaal');applyLang();
if(S.onboarded)show('vandaag');else vOnboard();
})();
