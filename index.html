<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leren">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Leren</title>
<meta name="theme-color" content="#f4f6f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
/* Layout: één smalle app-kolom voor de iPhone, vaste balk onderin, één taak per scherm.
   Palet: rustige pastels. Mint = groei, abrikoos = hoofdknop, hemelsblauw = water/herhalen en Engels, lila = bloemen. Geen rood. */
:root{
  --bg:#f4f6f1; --surface:#fdfdfb; --surface-2:#eceee6; --ink:#2c3833; --ink-2:#66736c; --line:#dde3d8;
  --mint:#dcefe4; --mint-fill:#a9d5bd; --mint-ink:#3e7b5d;
  --apricot:#fbefd9; --apricot-fill:#f3d89f; --apricot-ink:#8a6220;
  --sky:#e2eef7; --sky-fill:#b6d4ea; --sky-ink:#3c6d8e;
  --lilac:#eee9f7; --lilac-fill:#d2c7ec; --lilac-ink:#6c5d98;
  --shadow:0 1px 2px rgba(44,56,51,.05), 0 8px 24px -16px rgba(44,56,51,.18);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-thai:"IBM Plex Sans Thai Looped","Thonburi","Leelawadee UI","Noto Sans Thai",sans-serif;
  --r:22px; --r-s:14px;
  --mint-deep:#79b597; --apricot-deep:#d9b46a; --sky-deep:#8db6d6; --lilac-deep:#b2a4da; --wood:#c9a377; --sun:#f6dc9a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1f1d; --surface:#242b28; --surface-2:#2d3531; --ink:#e8eee9; --ink-2:#a8b5ad; --line:#38423d;
  --mint:#24392e; --mint-fill:#4e7c65; --mint-ink:#a6d8bd;
  --apricot:#372f20; --apricot-fill:#9b7c45; --apricot-ink:#f0d39c;
  --sky:#213443; --sky-fill:#4c7290; --sky-ink:#b0d1ea;
  --lilac:#2e2a3d; --lilac-fill:#6a5d92; --lilac-ink:#cec2ec;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 28px -16px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1f1d; --surface:#242b28; --surface-2:#2d3531; --ink:#e8eee9; --ink-2:#a8b5ad; --line:#38423d;
  --mint:#24392e; --mint-fill:#4e7c65; --mint-ink:#a6d8bd;
  --apricot:#372f20; --apricot-fill:#9b7c45; --apricot-ink:#f0d39c;
  --sky:#213443; --sky-fill:#4c7290; --sky-ink:#b0d1ea;
  --lilac:#2e2a3d; --lilac-fill:#6a5d92; --lilac-ink:#cec2ec;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 28px -16px rgba(0,0,0,.6); color-scheme:dark}
:root[data-size="groot"]{font-size:112%}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
.app{max-width:560px;margin:0 auto;padding-block:10px 124px}
.app.sess{padding-bottom:40px}
.view{display:flex;flex-direction:column;gap:16px;animation:in .28s ease both}
@keyframes in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em;line-height:1.15}
h1{font-size:1.9rem;font-weight:800} h2{font-size:1.35rem;font-weight:700} h3{font-size:1.06rem;font-weight:700}
p{margin:0}
button,a.btn{font:inherit;color:inherit;cursor:pointer;text-decoration:none}
button:active{transform:scale(.98)}
:focus-visible{outline:3px solid var(--sky-fill);outline-offset:2px;border-radius:10px}
.sup{color:var(--ink-2);font-size:.9em;line-height:1.5;display:block;font-weight:400}
:lang(th){font-family:var(--f-thai)}
:root[data-thai="uit"] .sup{display:none!important}
:root[data-thai="tik"] .bi .sup{display:none}
:root[data-thai="tik"] .bi.show .sup{display:block}
.muted{color:var(--ink-2)} .small{font-size:.86rem} .num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
button.card{width:100%;text-align:left}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
@media (max-width:480px){.grid2.stack-sm{grid-template-columns:1fr}}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:8px}
.top>div{min-width:0}
.thai-switch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex-shrink:0}
.thai-switch button{border:0;background:transparent;padding:7px 11px;font-size:.78rem;font-weight:700;color:var(--ink-2)}
.thai-switch button[aria-pressed="true"]{background:var(--mint-fill);color:var(--ink)}
.hero{background:var(--mint);border:0;position:relative;overflow:hidden;padding:20px}
.hero .art{position:absolute;right:-6px;top:-4px;width:140px;height:120px;pointer-events:none}
.hero h2{font-size:1.5rem}
.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;position:relative}
.steps li{display:flex;align-items:center;gap:10px;font-size:.96rem}
.steps .dot{width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.8rem;font-weight:800;flex-shrink:0;color:var(--mint-ink)}
.steps .min{margin-left:auto;color:var(--ink-2);font-size:.85rem;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:18px;border:0;font-weight:700;font-size:1.06rem;padding:10px 16px;text-align:center;transition:transform .1s ease}
.btn .bi{display:flex;flex-direction:column;align-items:center}
.btn .sup{font-size:.82em}
.btn svg{width:20px;height:20px}
.btn-main{background:var(--apricot-fill);color:var(--ink);box-shadow:0 4px 0 var(--apricot-deep,var(--apricot-ink))}
.btn-leaf{background:var(--mint-fill);color:var(--ink);box-shadow:0 4px 0 var(--mint-deep,var(--mint-ink))}
.btn-sky{background:var(--sky-fill);color:var(--ink);box-shadow:0 4px 0 var(--sky-deep,var(--sky-ink))}
.btn-main:active,.btn-leaf:active,.btn-sky:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn-main,.btn-leaf,.btn-sky{margin-bottom:4px}
/* kleur per vak (concept stap 1): Nederlands groen, rekenen geel, Engels blauw, wereld en kennis lila */
[data-vak="nl"] .sess-top .bar i{background:var(--mint-fill)}[data-vak="rk"] .sess-top .bar i{background:var(--apricot-fill)}[data-vak="en"] .sess-top .bar i{background:var(--sky-fill)}[data-vak="kn"] .sess-top .bar i{background:var(--lilac-fill)}
[data-vak="nl"] .stage-label .eyebrow{color:var(--mint-ink)}[data-vak="rk"] .stage-label .eyebrow{color:var(--apricot-ink)}[data-vak="en"] .stage-label .eyebrow{color:var(--sky-ink)}[data-vak="kn"] .stage-label .eyebrow{color:var(--lilac-ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linkish{background:none;border:0;padding:8px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:.95rem;width:100%;text-align:center}
.hero .btn-main{margin-top:16px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:grid;gap:6px;box-shadow:var(--shadow);min-width:0;align-content:start}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile h3{font-size:1rem}
.tile.mint .ic{background:var(--mint);color:var(--mint-ink)} .tile.sky .ic{background:var(--sky);color:var(--sky-ink)}
.tile.apricot .ic{background:var(--apricot);color:var(--apricot-ink)} .tile.lilac .ic{background:var(--lilac);color:var(--lilac-ink)}
.tile.wide{grid-template-columns:auto 1fr;align-items:center;gap:12px;border-color:var(--sky-fill)}
.flag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:2px 6px;background:var(--sky);color:var(--sky-ink);vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;white-space:nowrap;border:0}
.pill-mint{background:var(--mint);color:var(--mint-ink)} .pill-sky{background:var(--sky);color:var(--sky-ink)}
.pill-apricot{background:var(--apricot);color:var(--apricot-ink)} .pill-lilac{background:var(--lilac);color:var(--lilac-ink)}
.week{display:flex;justify-content:space-between;gap:4px;margin-top:10px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--ink-2);font-weight:700}
.day i{width:26px;height:26px;border-radius:50%;display:block;border:2px solid var(--line)}
.day.done i{background:var(--mint-fill);border-color:var(--mint-fill)}
.day.today i{border-color:var(--apricot-fill);border-width:3px}
.ring{width:80px;height:80px;flex-shrink:0}
.wring{position:relative;width:116px;height:116px;flex-shrink:0}.wring .ring{width:116px;height:116px}.wring .ring text{display:none}.ring .tick{stroke:var(--ink-2)}.ring .tick.hit{stroke:var(--surface)}
.wring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.wring .mid b{font-size:1.35rem}.wring .mid span{font-size:.68rem;color:var(--ink-2);max-width:74px}
.wcard{display:flex;flex-direction:column;gap:12px}
.wbars{display:flex;gap:6px;justify-content:space-between}
.wbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--ink-2)}
.wbar b{display:block;width:100%;max-width:30px;height:44px;border-radius:8px;background:var(--surface-2);position:relative;overflow:hidden}
.wbar b i{position:absolute;left:0;right:0;bottom:0;background:var(--mint-fill)}
.wbar.full b i{background:var(--mint-ink)}
.wbar.today{color:var(--ink)}.wbar.today b{box-shadow:0 0 0 3px var(--apricot-fill)}
.goal-pick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.goal-pick button,.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600}
.goal-pick button[aria-pressed="true"],.chips button[aria-pressed="true"]{border-color:var(--apricot-fill);background:var(--apricot)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));z-index:20}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.78rem;font-weight:700;color:var(--ink-2)}
.nav button .sup{font-size:.68rem}
.nav button[aria-current="page"]{color:var(--mint-ink)}
.nav button[aria-current="page"] svg{background:var(--mint);border-radius:10px}
.nav svg{width:44px;height:28px;padding:3px 10px}
.sess-top{display:flex;align-items:center;gap:12px;padding-top:6px}
.close{border:0;background:var(--surface-2);width:42px;height:42px;border-radius:50%;font-size:1.2rem;flex-shrink:0;color:var(--ink)}
.bar{flex:1;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint-fill);border-radius:999px;transition:width .45s ease}
.stage-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prompt{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.25}
.prompt.sp{font-weight:600}
.input{width:100%;min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.2rem;padding:10px 14px}
.input:focus{border-color:var(--mint-fill);outline:none}
textarea.input{min-height:90px;font-size:1rem;resize:vertical}
.speak{border:0;background:var(--sky);color:var(--sky-ink);border-radius:999px;padding:9px 14px;font-weight:700;font-size:.9rem;display:inline-flex;gap:8px;align-items:center}
.speak svg{width:16px;height:16px;flex-shrink:0}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:4px;animation:in .2s ease both}
.fb-ok{background:var(--mint)} .fb-ok strong{color:var(--mint-ink)}
.fb-no{background:var(--apricot)} .fb-no strong{color:var(--apricot-ink)}
.pieces{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border-radius:16px;border:2px dashed var(--line);align-content:flex-start}
.pieces.pool{border-style:solid;background:var(--surface-2);border-color:transparent}
.piece{border:0;background:var(--surface);border-radius:12px;padding:10px 14px;font-size:1.05rem;font-weight:600;box-shadow:0 0 0 1.5px var(--line) inset}
.piece.verb{box-shadow:0 0 0 2px var(--apricot-fill) inset;background:var(--apricot)}
.example{background:var(--surface-2);border-radius:var(--r-s);padding:12px 14px;display:grid;gap:4px}
.slot{display:inline-block;border-radius:8px;padding:1px 7px;margin:0 1px;font-weight:700}
.s1{background:var(--sky);color:var(--sky-ink)} .s2{background:var(--apricot);color:var(--apricot-ink)} .s3{background:var(--mint);color:var(--mint-ink)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.one{grid-template-columns:1fr}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:16px;min-height:64px;font-size:1.12rem;font-weight:700;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.choice.right{border-color:var(--mint-fill);background:var(--mint)}
.choice.wrong{border-color:var(--apricot-fill);background:var(--apricot)}
.note{background:var(--apricot);border-radius:var(--r-s);padding:12px 14px;font-size:.94rem}
.note.sky{background:var(--sky)} .note.lilac{background:var(--lilac)}
.receipt{font-family:ui-monospace,"SF Mono",Menlo,monospace;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;font-size:.95rem;max-width:300px;margin-inline:auto;width:100%;box-shadow:var(--shadow)}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
.worked{display:grid;gap:8px}
.worked .ln{display:flex;gap:10px;align-items:baseline}
.worked .ln b{color:var(--mint-ink);min-width:22px}
.hint-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hintbtn{border:1.5px dashed var(--lilac-fill);background:var(--lilac);color:var(--lilac-ink);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.85rem}
.hintbtn .bi{display:inline}
.hintshow{font-weight:700;color:var(--lilac-ink)}
.help{border:0;background:none;color:var(--ink-2);font-weight:600;font-size:.88rem;text-decoration:underline;text-underline-offset:3px;padding:6px 0;text-align:left}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coins{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:8px 0}
.coin{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;background:var(--apricot);border:3px solid var(--apricot-fill);color:var(--apricot-ink)}
.coin.small{width:48px;height:48px;font-size:.8rem}
.bill{width:96px;height:56px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:var(--mint);border:2px solid var(--mint-fill);color:var(--mint-ink)}
.clock{width:150px;height:150px;margin:0 auto;display:block}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.trio>div{background:var(--surface-2);border-radius:var(--r-s);padding:10px 6px;display:grid;gap:2px;min-width:0}
.trio .lg{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.trio .wd{font-weight:700;font-size:1.04rem;overflow-wrap:anywhere}
.story .sent{display:block;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:1.1rem;line-height:1.55}
.story .sent:last-child{border-bottom:0}
.speed{font-family:var(--f-display);font-size:3rem;font-weight:800;text-align:center;line-height:1.05;overflow-wrap:anywhere}
.timer{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--sky-fill);transition:width 1s linear}
.big{font-family:var(--f-display);font-size:3.2rem;font-weight:800;color:var(--mint-ink);line-height:1}
.celebrate{text-align:center;display:grid;gap:12px;justify-items:center}
.wordcard{display:grid;gap:8px;text-align:center;justify-items:center;padding:10px 0}
.wordcard .art{font-weight:800;font-size:.9rem;border-radius:999px;padding:3px 12px}
.art-de{background:var(--sky);color:var(--sky-ink)} .art-het{background:var(--lilac);color:var(--lilac-ink)}
.wordcard .w{font-family:var(--f-display);font-size:2.2rem;font-weight:800;overflow-wrap:anywhere}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.plant{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.plant svg{width:64px;height:64px}
.vflag{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.15)}.vflag span{flex:1;font-size:.9rem}.vflag .btn{width:auto;min-height:40px;padding:6px 12px}
.bubble{background:var(--surface-2);border-radius:16px;padding:10px 12px;position:relative}.bubble .who{display:block;font-size:.78rem;font-weight:700;color:var(--ink-2);text-transform:capitalize}
.plant{position:relative}.plant .lamp{position:absolute;top:4px;right:4px;width:20px;height:20px;color:var(--apricot-ink)}.plant .lamp svg{width:20px;height:20px}
.plant .w{font-weight:700;font-size:.88rem;line-height:1.2;overflow-wrap:anywhere}
.plant .sup{font-size:.74rem}
.plant.thirsty{border-color:var(--sky-fill);background:var(--sky)}
.bed{display:grid;gap:10px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.route{display:grid;padding-left:4px}
.stn{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;position:relative;padding-bottom:18px}
.stn:not(:last-child)::before{content:"";position:absolute;left:18px;top:32px;bottom:-2px;width:3px;background:var(--line);border-radius:2px}
.stn.done:not(:last-child)::before{background:var(--mint-fill)}

/* S is een let verderop: vóór het laden (TDZ) gooit zelfs typeof S een fout, daarom try */
function curS(){try{return S}catch(e){return null}}
function learnL(){const s=curS();return (s&&LEARN.includes(s.learn)&&s.learn)||'nl'}
function supL(){const s=curS();return (s&&SUPPORT.includes(s.sup)&&s.sup)||'th'}
function tr(key,lang,vars){const tb=I18N[lang]||{};let s=tb[key+'@'+supL()];if(s==null)s=tb[key];if(s==null)return null;
  if(typeof s==='object')s=(vars&&vars.n===1?s.one:s.other)??s.other;
  const v=Object.assign({sup:(LANG[supL()].name[lang]||'')},vars||{});return String(s).replace(/\{(\w+)\}/g,(m,k)=>k in v?(typeof v[k]==='function'?v[k](lang):v[k]):m)}
function t(key,vars){return tr(key,learnL(),vars)??tr(key,'en',vars)??key}
function ts(key,vars){const P=supL();return P===learnL()?'':(tr(key,P,vars)??'')}
const strip=s=>String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
function supAttr(){const L=LANG[supL()];return `lang="${L.tag}"${L.dir==='rtl'?' dir="rtl"':''}`}
/* bi(leertaal, steuntaal): de steuntaalregel valt weg als hij leeg is of gelijk aan de leertaal (bijv. Engelse les met steuntaal Engels). */
const bi=(a,b)=>`<span class="bi"><span class="nl">${a}</span>${b&&strip(b)!==strip(a)?`<span class="sup" ${supAttr()}>${b}</span>`:''}</span>`;
function T(key,vars){return bi(t(key,vars),ts(key,vars))}
/* platte tekst voor meldingen: "leertaal · steuntaal" (in de NL-stand alleen leertaal) */
function tx(key,vars){const a=strip(t(key,vars)),b=strip(ts(key,vars));return a+(b&&b!==a&&!nlOnly()?' · '+b:'')}
/* knoplabel: leertaal + steuntaalregel, zonder .bi-omhulling */
function TB(key,vars){const a=t(key,vars),b=ts(key,vars);return a+(b&&strip(b)!==strip(a)?`<span class="sup" ${supAttr()}>${b}</span>`:'')}
/* inhoud: vertaling in de steuntaal. L_(x) = x.th / x.en; L_(x,'why') = x.whyTh / x.whyEn. M_(x,'why') = leertaaltekst, met variant x['why@en'] voor steuntaal en. */
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function L_(x,f){if(!x)return '';const P=supL(),v=f?x[f+cap(P)]:x[P];return v==null?'':v}
function M_(x,f){return x?(x[f+'@'+supL()]??x[f]??''):''}

/* ============ opslag veilig laden (#30) ============
   S.v blijft 2. S.schema telt de vorm van de opslag (zonder veld = 1). Elke stap n -> n+1 staat in MIGRATE en mag vaker draaien.
   Vóór een migratie gaat de ruwe opslag ongewijzigd naar BAK (één generatie); ook vóór Alles wissen en vóór Terugzetten.
   STORE: 'ok' = normaal | 'broken' = onleesbaar of onbekend: herstelscherm, niets wegschrijven | 'newer' = van een nieuwere app: alleen lezen.

const SCHEMA=6,BAK=KEY+'.bak',BROKEN=KEY+'.kapot';
const MIGRATE={
 1:s=>{if(!s.profile||typeof s.profile!=='object')s.profile={name:''};if(!LEARN.includes(s.learn))s.learn='nl';if(!SUPPORT.includes(s.sup))s.sup='th';

 3:s=>{for(const it of Object.values(s.items||{})){if(it&&typeof it==='object'&&!Array.isArray(it.exs))it.exs=[];if(it&&typeof it==='object'&&it.t==null&&typeof it.s==='number'&&it.s>0&&typeof it.due==='number')it.t=it.due-it.s*864e5}if(Object.keys(s.days||{}).length&&s.f3pending==null)s.f3pending=1;return s},
 4:s=>{if(!s.world||typeof s.world!=='object'||Array.isArray(s.world))s.world={done:{},at:null};if(!s.world.done||typeof s.world.done!=='object')s.world.done={};return s},
 5:s=>{if(!s.errs||typeof s.errs!=='object'||Array.isArray(s.errs))s.errs={};if(s.world&&typeof s.world==='object'&&(!s.world.ok||typeof s.world.ok!=='object'))s.world.ok={};if(s.world&&typeof s.world==='object'&&(!s.world.best||typeof s.world.best!=='object'))s.world.best={};for(const it of Object.values(s.items||{}))if(it&&typeof it==='object'&&typeof it.h!=='string')it.h='';if(typeof s.trial!=='boolean')s.trial=false;if(typeof s.seenNews!=='string')s.seenNews='';return s}   // diepte en diagnose: foutprofiel per soort fout, beheerste scènes (alleen toegevoegd)   // concept stap 2: scènes (alleen toegevoegd)   // fase 3: goede oefeningen per item (docs/herhaalmodel.md)
};

function checkState(o){if(!o||typeof o!=='object'||Array.isArray(o)||o.v!==2||!o.items||typeof o.items!=='object'||Array.isArray(o.items))return 'broken';
  const n=schemaOf(o);if(!Number.isInteger(n)||n<1)return 'broken';return n>SCHEMA?'newer':'ok'}
function migrate(o){let n=schemaOf(o);while(n<SCHEMA){if(typeof MIGRATE[n]!=='function')throw new Error('migratiestap '+n+' ontbreekt');o=MIGRATE[n](o)||o;n++;o.schema=n}return o}

function fillDefaults(o){const f=fresh();for(const k in f)if(!(k in o))o[k]=f[k];return o}

(()=>{const raw=rawStore(KEY);if(raw==null){S=fresh();return}

/* herhaalmodel: stabiliteit (dagen) groeit bij goed, krimpt bij fout */
function stage(id){const s=S.items[id].s;return s<=0?0:s<1.5?1:s<4?2:s<10?3:s<25?4:5}
const STAGES=[['zaadje','เมล็ด','seed'],['kiemplant','ต้นอ่อน','seedling'],['plantje','ต้นเล็ก','small plant'],['knop','ดอกตูม','bud'],['bloem','ดอกไม้','flower'],['in volle bloei','บานเต็มที่','in full bloom']];
function thirsty(id){const it=S.items[id];return !!it&&it.reps>0&&it.due<=now()}   // ook in volle bloei: na de wachttijd komt het terug (review fase 3, punt 1)
function review(id,res,form,exid,passive){   /* M1 (stand per onderdeel), M2 (gespreid, groei alleen na een echte wachttijd), M12 (logboek) */
  /* res: true = goed bij de eerste poging, 'retry' = goed na een hint of tweede poging, false = fout.
     passive: een bij-item van een oefening; telt alleen bij goed, voor vormen en oefeningen, zonder groei (docs/herhaalmodel.md sectie 3).
     Groei alleen bij gespreid ophalen (sectie 5): pas vanaf de helft van de wachttijd, en naar verhouding:
     op de helft × 1,7, aan de beurt × 2,4. Zo levert vaker oefenen op één dag geen snellere bloei op. */
  const it=S.items[id];if(!it)return;if(!Array.isArray(it.exs))it.exs=[];
  if(passive&&res!==true)return;
  if(!passive&&it.placed){delete it.placed;if(res===false){it.s=0;it.reps=0;it.due=now();S.introduced=S.introduced.filter(x=>x!==id);S.log.push({t:now(),id,ok:false,pl:1});if(S.log.length>MOTOR.logMax)S.log.shift();save();return}}   // uit de startmeting en toch fout: als nieuw, geen fout (sectie 9)
  if(res===true||res==='retry'){if(form&&!passive&&!it.forms.includes(form))it.forms.push(form);if(exid&&!it.exs.includes(exid)){it.exs.push(exid);if(it.exs.length>10)it.exs.shift()}}
  if(!passive)it.reps++;
  if(!passive){
    /* it.t = begin van de huidige wachttijd (laatste fout, groei of inplanning). Na een fout: t = nu, dus direct daarna goed geeft geen groei (review fase 3, punt 2). */
    const t0=typeof it.t==='number'?it.t:it.due-Math.max(0,it.s)*DAY;
    if(res===true){if(it.s<=0){it.s=MOTOR.firstDays;it.t=now();it.due=now()+MOTOR.firstDays*DAY}
      else{const f=Math.min(1,(now()-t0)/(it.s*DAY));if(f>=MOTOR.growFrom){it.s=Math.min(MOTOR.maxDays,it.s*(1+MOTOR.growGain*f));if(it.s>=MOTOR.bloomDays&&!canBloom(id,it))it.s=MOTOR.bloomCap;it.t=now();it.due=now()+it.s*DAY}else{it.t=t0;it.due=t0+it.s*DAY}}}
    else if(res==='retry'){it.t=now();it.due=now()+Math.max(0,it.s)*DAY}
    else{it.lapses++;it.s=Math.max(MOTOR.lapseMin,it.s*MOTOR.lapseKeep);it.t=now();it.due=now()}}
  S.log.push({t:now(),id,ok:res===true,...(res==='retry'?{r:1}:{}),...(exid?{ex:exid}:{}),...(passive?{p:1}:{})});if(S.log.length>MOTOR.logMax)S.log.shift();
  if(!passive)histAdd(it,id,form,res);
  if(!passive&&res===true&&it.lapses>=MOTOR.leechLapses){const L=S.log.filter(e=>e.id===id&&!e.p).slice(-MOTOR.leechRecover);if(L.length===MOTOR.leechRecover&&L.every(e=>e.ok))it.lapses=MOTOR.leechBack}   // hardnekkig: na 3 keer achter elkaar goed weer gewoon (sectie 8)
  save();
}
/* eis voor doorgroeien boven 9 dagen (docs/herhaalmodel.md sectie 4, besluit 13 november 2026):
   woord: drie vormen; regel: drie verschillende oefeningen, minstens één keer zin bouwen;
   klank: drie verschillende oefeningen, minstens één keer luisteren en typen; rekenvaardigheid: drie verschillende varianten. */
function canBloom(id,it){const k=KIND[id]||'word',f=(it.forms||[]).filter(x=>!NOGROW.includes(x)),n=(it.exs||[]).length,B=MOTOR.bloomExs;   /* M9 beheerst pas na meerdere vormen over tijd */
  return k==='rule'?n>=B&&f.includes('build'):k==='sound'?n>=B&&f.includes('luisteren'):k==='skill'?n>=B:f.length>=MOTOR.bloomForms}
/* een onderdeel is voor het eerst aangeboden (voorbeeld, uitleg, kaart): plannen, maar niet als gekend tellen */
function introduce(id,form){const it=S.items[id];if(!it)return;if(!S.introduced.includes(id))S.introduced.push(id);if(form&&!it.forms.includes(form))it.forms.push(form);if(it.reps===0){it.reps=1;it.due=now()}save()}
/* een oefening met items: het eerste item is het doel; alleen dat krijgt een fout */
function practiced(q,res,form){const ids=(q&&q.items)||[];ids.forEach((id,i)=>{if(!S.introduced.includes(id)&&S.items[id])S.introduced.push(id);review(id,res,form,q.exid,i>0)})}

/* ============ voorlezen ============
   Altijd een stem in de juiste taal: de gekozen stem (Ik → Voorlezen), anders de beste voor nl-NL (natuurlijk/verbeterd eerst, nl-BE pas daarna).
   Kent de browser wél stemmen maar geen enkele in deze taal, dan leest de app NIET voor met een anderstalige stem (dat leert een verkeerde
   uitspraak aan) en legt Ik → Voorlezen uit hoe je er een installeert.
   Geeft de browser géén lijst (besluiten Emiel 12 nov 2026):
   - iPhone/iPad: meteen voorlezen met alleen de taal (nl-NL). iOS geeft in de beginscherm-app soms geen lijst, maar kiest op taal wel
     zijn eigen Nederlandse stem. Meteen, zodat het nog als reactie op een tik telt (anders blokkeert iOS het geluid).
   - Elders: eventjes wachten tot de stemmen geladen zijn en dan alleen de laatste tekst voorlezen. Blijft de lijst leeg, dan niet
     voorlezen: het systeem zou zelf een stem kiezen, vaak een Engelse (zo ging het mis in het voorbeeldvenster van de Claude-app). */
const LANGS={nl:{tag:'nl-NL',re:/^nl/i,main:/^nl[-_]NL/i,adj:'Nederlandse'},en:{tag:'en-GB',re:/^en/i,main:/^en[-_]GB/i,adj:'Engelse'}};
function isIOS(){try{return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}catch(e){return false}}
let allVoices=[];const voiceWarned={};
function loadVoices(){try{allVoices=speechSynthesis.getVoices()||[]}catch(e){allVoices=[]}return allVoices}
function voiceScore(v,L){let s=0;if(L.main.test(v.lang))s+=100;if(/natural|neural|premium|enhanced|verbeterd|online|google/i.test(v.name))s+=50;if(/compact|novelty|eloquence/i.test(v.name+' '+(v.voiceURI||'')))s-=40;if(v.localService)s+=5;return s}
function voicesFor(lang){const L=LANGS[lang]||LANGS.nl;return loadVoices().filter(v=>L.re.test(v.lang)).sort((a,b)=>voiceScore(b,L)-voiceScore(a,L))}
function voiceFor(lang){const vs=voicesFor(lang),want=S.voice&&S.voice[lang];return (want&&vs.find(v=>(v.voiceURI||v.name)===want))||vs[0]||null}
function noVoice(lang){return loadVoices().length>0&&!voicesFor(lang).length}
try{speechSynthesis.onvoiceschanged=()=>{loadVoices();try{if(tab==='ik'&&!route&&!app.classList.contains('sess'))vMe()}catch(e){}};loadVoices()}catch(e){}
let voiceWait=null,voicePend=null;
function speakNow(t,slow,lang,v){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LANGS[lang].tag;if(v)u.voice=v;u.rate=slow?.68:.9;speechSynthesis.speak(u)}
function say(t,slow,lang,waited){if(QUIET)return;lang=LANGS[lang]?lang:'nl';const L=LANGS[lang];t=String(t==null?'':t).replace(/<[^>]*>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
  if(typeof speechSynthesis==='undefined'||typeof SpeechSynthesisUtterance==='undefined'){if(!voiceWarned.api){voiceWarned.api=1;toast('Voorlezen werkt niet in deze browser.')}return}
  try{
  if(!loadVoices().length){
    if(isIOS())return speakNow(t,slow,lang,null);
    if(!waited&&!voiceWarned.none){const first=!voicePend;voicePend={t,slow,lang};
      if(first){const go=ev=>{if(ev&&!loadVoices().length)return;clearTimeout(voiceWait);speechSynthesis.removeEventListener('voiceschanged',go);const p=voicePend;voicePend=null;if(p)say(p.t,p.slow,p.lang,true)};
        speechSynthesis.addEventListener('voiceschanged',go);voiceWait=setTimeout(go,900)}return}
    if(!voiceWarned.none){voiceWarned.none=1;toast(tx('voice.noneHere'))}return}
  if(noVoice(lang)){if(!voiceWarned[lang]){voiceWarned[lang]=1;toast(`Geen ${L.adj} stem op dit toestel. Zie Ik → Voorlezen.`)}return}
  speakNow(t,slow,lang,voiceFor(lang))}catch(e){toast('Voorlezen werkt niet in deze browser.')}}

   :noVoice('nl')?`<div class="note">${T('voice.none')}</div>`
   :isIOS()?`<p class="small muted">${T('voice.deviceChooses')}</p>`:`<p class="small muted">${T('voice.notLoaded')}</p>`}
  <button class="btn btn-ghost" id="vtest">${T('voice.try')}</button>
  <details${noVoice('nl')?' open':''}><summary class="small muted">${T('voice.install')}</summary>
   <ul class="small" style="margin:8px 0 0;padding-left:18px;display:grid;gap:6px">
    <li><b>iPhone:</b> Instellingen → Toegankelijkheid → Gesproken materiaal → Stemmen → Nederlands. Kies een stem (bijvoorbeeld Xander of Claire), liefst de versie <i>Verbeterd</i>, en download die.</li>
    <li><b>Windows:</b> Instellingen → Tijd en taal → Spraak → Stemmen toevoegen → Nederlands. Of open de app in Microsoft Edge: die heeft natuurlijke Nederlandse stemmen.</li>
    <li><b>Android:</b> Instellingen → Systeem → Talen → Tekst-naar-spraak, en kies Nederlands.</li></ul>
   <p class="small muted">${T('voice.reopen')}</p></details></section>`}

function plant(st,thirst){
  const leaf='var(--mint-ink)',pot=thirst?'var(--sky-fill)':'var(--line)';
  let g=`<ellipse cx="32" cy="61" rx="17" ry="2.5" fill="var(--surface-2)"/><path d="M19 49h26l-3 12H22z" fill="${pot}"/><rect x="17" y="45" width="30" height="6" rx="3" fill="${pot}"/>`;
  if(st===0)g+=`<ellipse cx="32" cy="44" rx="4.5" ry="3.2" fill="var(--apricot-fill)"/>`;
  if(st>=1){const h=[0,8,15,21,25,27][st],top=45-h;
    g+=`<path d="M32 45V${top}" stroke="${leaf}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
    g+=`<path d="M32 ${45-h*.45}c-6-1-9-5-9-9 5 0 9 3 9 9z" fill="var(--mint-fill)"/>`;
    if(st>=2)g+=`<path d="M32 ${45-h*.72}c6-1 9-5 9-9-5 0-9 3-9 9z" fill="var(--mint-fill)"/>`;
    if(st===3)g+=`<circle cx="32" cy="${top-2}" r="3.5" fill="var(--mint-fill)"/>`;
    if(st===4)g+=`<ellipse cx="32" cy="${top-3}" rx="4.2" ry="5.5" fill="var(--lilac-fill)"/>`;
    if(st===5){for(let i=0;i<8;i++){const a=i*Math.PI/4,cx=(32+Math.cos(a)*6.5).toFixed(1),cy=(top-4+Math.sin(a)*6.5).toFixed(1);g+=`<ellipse cx="${cx}" cy="${cy}" rx="4.3" ry="3.3" transform="rotate(${i*45} ${cx} ${cy})" fill="var(--lilac-fill)"/>`}g+=`<circle cx="32" cy="${top-4}" r="3.8" fill="var(--apricot-fill)"/>`}
  }
  if(thirst)g+=`<path d="M51 12c3 4 4 6 4 8a4 4 0 0 1-8 0c0-2 1-4 4-8z" fill="var(--sky-fill)"/>`;
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${g}</svg>`;
}

function ring(p,label,marks){const r=32,c=2*Math.PI*r,v=Math.min(1,p),tick=f=>{const a=2*Math.PI*f-Math.PI/2,x1=40+(r-7)*Math.cos(a),y1=40+(r-7)*Math.sin(a),x2=40+(r+7)*Math.cos(a),y2=40+(r+7)*Math.sin(a);return `<line class="tick${f<=v?' hit':''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="2.5" stroke-linecap="round"/>`};return `<svg class="ring" viewBox="0 0 80 80" role="img" aria-label="${esc(label||'')} ${Math.round(v*100)} procent"><circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="9"/><circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--apricot-fill)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 40 40)"/>${(marks||[]).filter(f=>f>0&&f<1).map(tick).join('')}<text x="40" y="45" text-anchor="middle" font-family="Figtree,sans-serif" font-weight="800" font-size="15" fill="var(--ink)">${Math.round(v*100)}%</text></svg>`}

  const mid=left>0?`<b class="num">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b><span>${esc(t('week.left'))}</span>`:`<b>✓</b><span>${esc(t('week.done'))}</span>`;

/* ============ sessie-raamwerk ============ */
let SESS=[];   // goed of fout per antwoord in deze ronde (bijsturen)
let Q=[],qi=0,sp=0,grown=[],sessName='',sessStart=0,sessRight=0,sessTotal=0;
function runSession(name,queue){Q=queue;qi=0;SESS=[];KNOWN=new Set();RETRIED=new Set();sp=0;grown=[];sessName=name;sessStart=now();sessRight=0;sessTotal=0;$('#nav').hidden=true;app.classList.add('sess');window.scrollTo(0,0);step()}
function vakOf(q,stepNo){return q&&q.vak?q.vak:stepNo===4||(q&&['money','clock','discount'].includes(q.type))?'rk':(q&&(q.lang==='en'||/^en/.test(q.type)))||sessName==='Engels'?'en':'nl'}
function frame(inner,label,stepNo,ofN){app.dataset.vak=vakOf(Q[qi],stepNo);
  const p=Math.round(qi/Math.max(1,Q.length-1)*100);
  paint(`<div class="sess-top"><button class="close" id="quit" aria-label="Stoppen">×</button><div class="bar" role="progressbar" aria-label="Voortgang" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>${thaiSwitch()}</div>
  <div class="stage-label"><span class="eyebrow">${stepNo?`Stap ${stepNo} van ${ofN||(Q.some(x=>x.type==="sc_end")?4:5)} · `:''}${label}</span>${(x=>x?`<button class="u-btn" data-uopen="${esc(x)}">${TB('explain.open')}</button>`:'')(explFor(Q[qi]))}<span class="pill pill-apricot num">+${sp}</span></div>${inner}`);
  $('#quit').onclick=()=>{finishTime();if(sp>0)toast('Opgeslagen. Je punten blijven staan.');show('vandaag')};
  // #22: onthoud of er al iets met deze vraag gedaan is; dan tekent een taalwissel hem niet opnieuw (geen dubbele punten, geen reset van pogingen)
  const q=Q[qi],v=app.querySelector('.view');if(q&&v){const t=e=>{if(!e.target.closest('button[data-thai],#quit'))q._t=1};v.addEventListener('click',t,true);v.addEventListener('input',t,true)}
}
function finishTime(){save();syncUp(true)}   // leertijd telt de klok (leertijd en weekdoel)
/* bijsturen (docs/herhaalmodel.md sectie 7): over de laatste 8 antwoorden van deze ronde.
   Onder 65% goed: typen wordt kiezen, geen nieuwe onderdelen meer. Boven 95% (8 antwoorden): kiezen wordt typen. Stil, zonder oordeel. */
function adapt(){const last=SESS.slice(-MOTOR.adaptWindow);if(last.length<MOTOR.adaptMin)return;   /* M4 sturen op 80 tot 90% goed */const acc=last.filter(Boolean).length/last.length;
  for(let i=qi;i<Q.length;i++){const q=Q[i];if(q._t)continue;
    if(acc<MOTOR.adaptEasier){if(q._new)q._skip=true;else if(EASIER[q.type]&&q.w&&S.introduced.includes(q.w.id))q.type=EASIER[q.type];else if(!q.w&&q.items&&q.items.length&&q.exid&&!q._easy)Q[i]=easierEx(q)||q}
    else if(acc>MOTOR.adaptHarder&&last.length>=MOTOR.adaptWindow&&HARDER[q.type]&&q.w&&((S.items[q.w.id]||{}).forms||[]).includes('herkennen'))q.type=HARDER[q.type]}}
/* een makkelijkere oefening voor hetzelfde onderdeel, als die er is: lagere afbouwtrede (fade) of een kiesvorm i.p.v. bouwen of opschrijven */
function easierEx(q){try{const base=q.exid.split('#')[0],P=PACKS.find(p=>(p.exercises||[]).some(e=>e.id===base));if(!P)return null;const cur=P.exercises.find(e=>e.id===base),id=q.items[0];
  const hard=e=>(e.fade||0)*2+(e.form==='build'||(e.data&&e.data.mode==='type')?1:0),e=chooseEx(id,P.learn,true);if(!e||hard(e)>=hard(cur))return null;
  const n=exQ(e,q.step,P.learn==='en'?'en':'nl',id);if(n)n._easy=1;return n}catch(err){return null}}
function next(){qi++;adapt();window.scrollTo(0,0);step()}
let KNOWN=new Set(),RETRIED=new Set();
function step(){voicePend=null;while(Q[qi]&&(Q[qi]._skip||(Q[qi]._ifUnknown&&Q[qi].w&&KNOWN.has(Q[qi].w.id))||(Q[qi]._skipKnown&&KNOWN.has(Q[qi]._rule||(Q[qi].items||[])[0]))))qi++;const q=Q[qi];if(!q)return show('vandaag');H[q.type](q)}
/* na een fout: het onderdeel één keer terug in deze ronde, minstens vijf onderdelen later, in een andere vorm (advies ontwerpsessie B) */
const OTHER={recall:'recog',recog:'recall',hear:'recog',enrecall:'enrecog',enrecog:'enrecall',enhear:'enrecog'};
function retryLater(q){   /* M3 terug in een andere vorm, niet direct erna */
if(!q||q._probe||q._retry)return;const id=q.w?q.w.id:q.items&&q.items[0];if(!id||RETRIED.has(id))return;
  let r=null;if(q.w&&OTHER[q.type])r={type:OTHER[q.type],step:q.step,w:q.w};else if(q.items&&q.exid)r=easierEx(q);if(!r)return;
  RETRIED.add(id);r._retry=1;const conf=Q.findIndex((x,i)=>i>qi&&x.type==='conf'),at=conf<0?Q.length:conf;Q.splice(Math.min(qi+MOTOR.retryGap,at),0,r)}
function score(ok,n,part){sessTotal++;SESS.push(!!ok);if(!ok)retryLater(Q[qi]);if(ok){sessRight++;sp+=n;addPts(n)}else if(part>0){sp+=part;addPts(part)}}
/* fbBox(ok, tekst in de leertaal, tekst in de steuntaal); fbK(ok, sleutel, variabelen) haalt beide uit I18N */
function fbBox(ok,msg,msgSup){let offer='';if(!ok&&app.classList.contains('sess')&&Q[qi]&&Q[qi]._sceneErr&&!Q[qi]._faulted){Q[qi]._faulted=1;scFault(Q[qi],Q[qi]._sceneErr)}   /* hooguit één keer per vraag (codereview A2) */if(!ok&&app.classList.contains('sess')&&Q[qi]){const q=Q[qi];q._wrong=(q._wrong||0)+1;const x=q._wrong>=2&&explFor(q);if(x)offer=`<button class="linkish u-offer" data-uopen="${esc(x)}">${TB('explain.offer')}</button>`}const k=ok?'fb.ok':'fb.no',s=ts(k);return `<div class="fb ${ok?'fb-ok':'fb-no'}" role="status"><strong>${t(k)}${nlOnly()||!s?'':` <span ${supAttr()}>${s}</span>`}</strong>${msg?bi(msg,msgSup||''):''}${offer}</div>`}
function fbK(ok,k,vars){return fbBox(ok,t(k,vars),ts(k,vars))}
const supSpan=(s,st)=>s?`<span class="sup" ${supAttr()}${st?` style="${st}"`:''}>${s}</span>`:'';
const helpBtn=ctx=>`<button class="help" data-help="${esc(ctx)}">${T('help.ask')}</button>`;
/* vertaling klopt niet: tik op een steunregel (niet in een knop), bevestig, en de melding gaat als hulpvraag naar de begeleider */
document.addEventListener('click',e=>{const s=e.target.closest&&e.target.closest('.sup');if(!s||s.closest('button,a,#nav,.ulayer'))return;

/* woorden die ook passen, in beide richtingen (also bij het ene of het andere woord): nooit als foute keuze, getypt geen fout (review 3) */
function alsoOf(w){return [...new Set([...(w.also||[]),...NL.filter(x=>(x.also||[]).includes(w.id)).map(x=>x.id)])]}
H.recog=q=>{const w=q.w;let first=true;const g=nlOnly()?gapEx(w):null,AL=alsoOf(w),others=NL.filter(x=>x.id!==w.id&&!AL.includes(x.id)),opts=shuffle([w,...shuffle(others).slice(0,2)]);

  if(nlOnly()&&!g){setTimeout(()=>say(`${fw(w)}`),250);$('#sp').onclick=()=>say(`${fw(w)}`);$('#sps').onclick=()=>say(`${fw(w)}`,true)}

function sceneQ(sc,hard){const q=[],vak=sc.subject||'nl',ph={look:1,talk:2,read:2,listen:2,slot:3,explain:3,do:3,make:3,rule:3,end:4},qph={instap:1,ophalen:1,controle:4};

  const ask=(base,qq,exid,o)=>{if(!EXF.includes(qq.form))return {...base,type:'sc_q',qq,items:qq.items.slice(),exid,hard:!!hard,...o};   // een vraag (docs/scenes.md, diepte en diagnose)
    const e={id:exid,form:qq.form,items:qq.items.slice(),...(qq.gen?{gen:qq.gen}:{data:qq.data}),fb:{ok:qq.why},hint:qq.hint},x=exQ(e,base.step,'nl',qq.items[0]);   // een bestaande oefenvorm: hetzelfde scherm als in de les

    else if(st.type==='quiz')st.q.forEach((qq,i)=>push(ask({...base,step:qph[st.role]||3},qq,sc.id+'#z'+k+'.'+i,{role:st.role,_skipKnown:st.role==='ophalen'})));   // instap goed: ophalen van dat onderdeel valt weg
    else if(st.type==='rule'){q.push({...base,type:'sc_rule',items:st.items.slice(),_skipKnown:1});st.q.forEach((qq,i)=>push(ask(base,qq,sc.id+'#r'+k+'.'+i,{role:'rule',_skipKnown:1,_rule:st.items[0]})))}
    else if(st.type==='speak')q.push({...base,type:'sc_speak',items:st.items.slice(),exid:sc.id+'#s'+k});

    else if(st.type==='extra'){}   /* alleen na een tweede fout van dezelfde soort: scFault */
    else if(st.type==='do'&&st.opts)push(ask(base,{form:'choose',items:st.items,ask:st.ask,opts:st.opts},sc.id+'#d'+k,{}));
    else if(st.type==='talk')st.turns.forEach((tu,ti)=>q.push({...base,type:'sc_talk',tu,ti,items:tu.items.slice(),exid:sc.id+'#t'+k+'.'+ti}));
    else if(st.type==='read'||st.type==='listen')st.q.forEach((qq,qi)=>push(qq.form?ask(base,qq,sc.id+'#q'+k+'.'+qi,{ctx:st.type}):{...base,type:'sc_read',qq,qi,items:qq.items.slice(),exid:sc.id+'#q'+k+'.'+qi}));

      if(top)for(const id of top.ids){if(out.length>=Math.max(1,Math.floor(st.n*MOTOR.slotErrShare)))break;if(used.has(id)||!S.items[id]||!S.items[id].reps)continue;const w=NL.find(x=>x.id===id);let x=null;
        if(w)x={type:pickForm(w,'nl','recall'),step,w,vak};else{const e=chooseEx(id,'nl',true);if(e){x=exQ(e,step,'nl',id);if(x)x.vak=vak}}if(x){x._err=top.err;out.push(x);used.add(id)}}
      NL.filter(w=>thirsty(w.id)&&!used.has(w.id)).sort((a,b)=>overdue(b.id)-overdue(a.id)).slice(0,st.n-out.length).forEach(w=>out.push({type:pickForm(w,'nl','recall'),step,w,vak}));

      else if(st.form==='point')q.push({...base,type:'sc_point',items:st.items.slice(),exid:sc.id+'#d'+k});
      else{const e={id:sc.id+'.d'+k,form:st.form,items:st.items.slice(),...(st.gen?{gen:st.gen}:{data:st.data})},x=exQ(e,step,'nl',st.items[0]);if(x){x.vak=vak;q.push(x)}}}

/* ---- diepte en diagnose (docs/scenes.md) ----
   Elke foute keuze heeft een soort fout (err). De app telt per soort, recente fouten wegen zwaarder (halveert in 14 dagen): het foutprofiel S.errs.
   Tweede fout van dezelfde soort in dezelfde scène: de stap extra van die soort komt direct na deze vraag. */
function errNote(err,id){   /* M5 per fout het soort; recent weegt zwaarder */
  if(!ERRS.includes(err))return;S.errs=S.errs||{};const e=S.errs[err]||{n:0,t:0,ids:[]},t0=now();e.n=+((e.n||0)*Math.pow(.5,(t0-(e.t||t0))/(MOTOR.errHalfDays*DAY))+1).toFixed(3);e.t=t0;if(id)e.ids=[id,...(e.ids||[]).filter(x=>x!==id)].slice(0,MOTOR.errIds);S.errs[err]=e;save()}
function errTop(){const t0=now();let best=null;for(const [err,e] of Object.entries(S.errs||{})){if(!e||!ERRS.includes(err))continue;const n=(e.n||0)*Math.pow(.5,(t0-(e.t||t0))/(MOTOR.errHalfDays*DAY));if(n>=MOTOR.errSteer&&(!best||n>best.n))best={err,n,ids:(e.ids||[]).slice()}}return best}
function scFault(q,err){if(!err||!ERRS.includes(err))return;errNote(err,q.items&&q.items[0]);if(!SCN||SCN.sc!==q.sc)return;SCN.errs[err]=(SCN.errs[err]||0)+1;
  if(SCN.errs[err]<MOTOR.extraAfter||SCN.extra.has(err))return;   /* M11 bij een herhaalde fout uitleg en extra oefening */const ex=q.sc.steps.filter(st=>st.type==='extra'&&st.err===err);if(!ex.length)return;SCN.extra.add(err);
  const add=[];ex.forEach(st=>{const k=q.sc.steps.indexOf(st),base={sc:q.sc,st,step:3,vak:q.vak};add.push({...base,type:'sc_extra'});st.q.forEach((qq,i)=>add.push({...base,type:'sc_q',qq,items:qq.items.slice(),exid:q.sc.id+'#x'+k+'.'+i,role:'extra'}))});
  Q.splice(qi+1,0,...add)}
/* instap goed bij de eerste poging: een nieuw woord maakt de grote sprong (probeDone), en ophalen van dat onderdeel valt weg */
function scKnow(q){const id=q.items[0],it=S.items[id],w=NL.find(x=>x.id===id);KNOWN.add(id);if(w&&it&&it.reps===0)probeDone(w,true);else practiced(q,true,SCF[q.qq.form])}

/* een getal zoals een Nederlander het typt: € 1.250,50 · 6,60 · 6 euro 60 · 25 cent · 1.000 (codereview B2). NaN als het geen getal is. */
function scNum(v){let x=String(v).toLowerCase().trim().replace(/€/g,'').replace(/,-$/,'').trim();let m=/^(\d+)\s*(euro|eur)\s*(\d{1,2})$/.exec(x);if(m)return +m[1]+ +m[3]/(m[3].length===1?10:100);
  m=/^(\d+)\s*(ct|cent)$/.exec(x);if(m)return +m[1]/100;x=x.replace(/(euro|eur)$/,'').replace(/\s+/g,'');
  if(x.includes(','))x=x.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');else if(/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(x))x=x.replace(/\./g,'');   /* 0.125 blijft 0,125 (nareview) */return /^-?\d+(\.\d+)?$/.test(x)?parseFloat(x):NaN}

function clockSvg(h,m){const hand=(ang,len,w,c)=>{const r=(ang-90)*Math.PI/180;return `<line x1="75" y1="75" x2="${(75+Math.cos(r)*len).toFixed(1)}" y2="${(75+Math.sin(r)*len).toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`};
  let t='';for(let i=0;i<12;i++){const r=(i*30-90)*Math.PI/180;t+=`<line x1="${(75+Math.cos(r)*57).toFixed(1)}" y1="${(75+Math.sin(r)*57).toFixed(1)}" x2="${(75+Math.cos(r)*64).toFixed(1)}" y2="${(75+Math.sin(r)*64).toFixed(1)}" stroke="var(--ink-2)" stroke-width="${i%3?2:3.5}" stroke-linecap="round"/>`}
  return `<svg class="clock" viewBox="0 0 150 150" role="img" aria-label="Een klok"><circle cx="75" cy="75" r="70" fill="var(--surface)" stroke="var(--mint-fill)" stroke-width="6"/>${t}${hand(((h%12)+m/60)*30,36,6,'var(--ink)')}${hand(m*6,54,4,'var(--sky-ink)')}<circle cx="75" cy="75" r="5" fill="var(--apricot-fill)"/></svg>`}

/* startmeting gebruiken (docs/herhaalmodel.md sectie 9): bij een hoge score (vanaf 0,67) komen de basisonderdelen van die vaardigheid
   binnen als plantje (s 2, over 2 dagen gecontroleerd), met placed. Alleen onderdelen zonder voortgang; bestaande voortgang blijft staan. */
function placeFromLevels(lv){const hi=k=>((lv||{})[k]||0)>=.67,ids=(learn,kinds)=>PACKS.filter(p=>p.learn===learn).flatMap(p=>p.items||[]).filter(x=>kinds.includes(x.kind)).map(x=>x.id);
  const mark=id=>{const it=S.items[id];if(!it||it.reps>0)return;it.s=2;it.reps=1;it.t=now();it.due=now()+2*DAY;it.placed=1;if(!S.introduced.includes(id))S.introduced.push(id)};
  if(hi('woorden'))NL.slice(0,6).forEach(w=>mark(w.id));
  if(hi('grammatica'))ids('nl',['rule']).forEach(mark);
  if(hi('luisteren'))ids('nl',['sound']).forEach(mark);
  if(hi('rekenen'))REK.forEach(x=>mark(x.id));
  if(hi('engels')){EN.slice(0,4).forEach(w=>mark(w.id));ids('en',['rule','sound']).forEach(mark)}}
H.placeend=q=>{const lv={};Object.keys(PL).forEach(k=>lv[k]=PL[k].g/PL[k].n);S.placement={t:now(),lv};
  placeFromLevels(lv);
  addPts(20);finishTime();save();
  const names=['woorden','grammatica','luisteren','lezen','rekenen','engels'];
  frame(`<div class="card stack">${T('place.thanks')}<p>${T('place.result')}</p>
   ${names.map(k=>`<div class="skill"><span>${T('skill.'+k)}</span><span class="track"><i style="width:${Math.max(6,(lv[k]||0)*100)}%;background:${k==='engels'?'var(--sky-fill)':k==='rekenen'?'var(--apricot-fill)':'var(--mint-fill)'}"></i></span><span class="num small muted">${Math.round((lv[k]||0)*100)}%</span></div>`).join('')}
   <div class="note sky">${T('place.result.note')}</div></div>
   <button class="btn btn-main" id="home">${T('place.toFirst')}</button>`,'Klaar');
  petals();$('#home').onclick=()=>show('vandaag')};

/* ============ voortgang naar de meekijker (EDGE leest dit als tonaor.json) ============
   app:'tonaor-leert' en de TLSync-domeinscheiding zijn vaste protocolnamen (besluit #6): niet wijzigen, anders breekt elke bestaande koppeling. */
function progressData(){
  const lv=S.placement?S.placement.lv:null,mastered=ids=>ids.filter(id=>stage(id)>=3).length/ids.length;
  const sk=lv?{nl:Math.min(1,((lv.woorden+lv.grammatica+lv.luisteren+lv.lezen)/4)*.6+mastered(NL.map(x=>x.id))*.4),rk:Math.min(1,lv.rekenen*.7+mastered(REK.map(x=>x.id))*.3),en:Math.min(1,lv.engels*.7+mastered(EN.map(x=>x.id))*.3)}:{nl:mastered(NL.map(x=>x.id)),rk:mastered(REK.map(x=>x.id)),en:mastered(EN.map(x=>x.id))};
  const r=v=>Math.round(v*100)/100,mon=today()-((new Date().getDay()+6)%7)*DAY,days=[],seen=[...NL,...EN,...REK].map(x=>x.id).filter(id=>S.items[id].reps>0),garden=[0,0,0,0,0,0];
  for(let i=0;i<7;i++)days.push(S.days[mon+i*DAY]?1:0);seen.forEach(id=>garden[stage(id)]++);
  const allW=[...NL.map(x=>({id:x.id,l:`${fw(x)}`})),...EN.map(x=>({id:x.id,l:x.w})),...REK.map(x=>({id:x.id,l:x.label}))];
  return {app:'tonaor-leert',v:1,t:now(),fase:'Fase 1',thema:'Thema 1 · Werk en dagelijks leven',placed:!!S.placement,
    skills:{nl:r(sk.nl),rk:r(sk.rk),en:r(sk.en)},week:{days,mins:Math.round(Object.entries(S.mins).filter(([d])=>+d>=mon).reduce((a,[,m])=>a+m,0)),goal:weekGoal()},
    talks:S.talks,sessions:S.sessions,points:pts(),garden,steer:{newPerDay:dayBudget(),roundLen:S.roundLen||'normaal',feel:feel(),fun:((S.conf||[])[0]||{}).fun||null},thirsty:seen.filter(id=>thirsty(id)).length,
    leeches:leeches().map(id=>(allW.find(a=>a.id===id)||{l:id}).l),
    help:S.help.slice(0,10).map(h=>({t:h.t,ctx:h.ctx,open:h.open})),
    seen:S.answers.map(a=>a.id).filter(Boolean).slice(0,40),
    writing:S.log.filter(l=>l.video||l.diary).slice(-3).reverse().map(l=>({t:l.t,kind:l.video?'video':'dagboek',text:l.video||l.diary}))};
}
async function sendProgress(){
  const txt=JSON.stringify(progressData()),d=new Date(),name=`voortgang-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.json`;
  const done=()=>{S.unsent=false;save();toast(tx('help.sent'));rerender()};
  try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Voortgang'+(nmText()?' van '+nmText():'')});return done()}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();done()}catch(e){toast('Delen lukt hier niet. Probeer het in de iPhone-app.')}
}

/* ============ automatische koppeling (versleuteld, via TLSync) ============ */
let upT=null,upBusy=false;
/* koppelingen waarover we versturen: altijd de sterke TL2-code; de oude TL1-code alleen tot de EDGE TL2 bevestigt (hello) */
function syncCodes(){const c=[];if(!TLS)return c;if(S.code2)c.push(S.code2);if(S.code&&!S.tl1off)c.push(S.code);return c}
function syncText(){if(!TLS)return T('sync.noAuto');if(!syncCodes().length)return T('sync.noCode');return S.lastSync?T('sync.last',{when:l=>new Date(S.lastSync).toLocaleString(l==='th'?'th-TH':l==='en'?'en-GB':'nl-NL',{weekday:'short',hour:'2-digit',minute:'2-digit'})}):T('sync.nothing')}
function syncUp(now_,cb){if(STORE!=='ok')return cb&&cb(false);clearTimeout(upT);upT=setTimeout(()=>{if(upBusy){return syncUp(false,cb)}const cs=syncCodes();if(!cs.length)return cb&&cb(false);upBusy=true;const data=progressData();let left=cs.length,any=false,all=true;const done=ok=>{any=any||ok;all=all&&ok;if(--left)return;upBusy=false;if(any){S.lastSync=now();if(all)S.unsent=false;else S.unsent=true;save()}cb&&cb(any)};cs.forEach(c=>{try{TLS.send(c,'up',data,done)}catch(e){done(false)}})},now_?50:4000)}
function gotDown(list,isV2){if(!list)return;let added=0,hello=false;list.forEach(a=>{if(a&&a.type==='hello'&&isV2){hello=true;return}if(!a||!a.id||S.answers.some(x=>x.id===a.id))return;S.answers.unshift({id:a.id,t:a.t||now(),ctx:a.ctx||'',text:a.text||'',seen:false});const h=S.help.find(x=>x.t===a.helpT);if(h)h.open=false;added++});
  if(hello){const was=v2live();S.v2seen=now();S.tl1off=true;save();if(!was)if(tab==='ik'&&!route&&!app.classList.contains('sess'))rerender()}
  if(added){save();syncUp();if(!route&&(tab==='vandaag'||tab==='ik')&&!app.classList.contains('sess'))rerender()}}
function syncDown(){syncCodes().forEach(c=>{try{TLS.fetchAll(c,'down',list=>gotDown(list,TLS.isV2(c)))}catch(e){}})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncDown();else if(S.unsent||!S.lastSync||now()-S.lastSync>36e5)syncUp(true)});
setInterval(()=>{if(document.visibilityState==='visible')syncDown()},90000);
setTimeout(()=>{syncDown();if(!S.lastSync||now()-S.lastSync>6*36e5)syncUp(true)},1500);

/* ============ voortgang bewaren en terugzetten (#30) ============
   Bestand: {app,kind:'reservekopie',schema,saved,data:S}. Het bevat ook de koppelcodes: privé (zo staat het ook in de app).
   Terugzetten: bestand valideren (checkState), huidige stand eerst naar BAK, dan migreren, wegschrijven en herladen. */
const fmtWhen=ts=>l=>{try{return new Date(ts).toLocaleString(l==='th'?'th-TH':l==='en'?'en-GB':'nl-NL',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())}
async function shareFile(txt,name,title){
  try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title});return true}}catch(e){if(e&&e.name==='AbortError')return false}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();return true}catch(e){return false}}
async function exportBackup(){const now0=now(),d=STORE==='ok'?S:(parseState(rawStore(KEY))||S),txt=JSON.stringify({app:'tonaor-leert',kind:'reservekopie',schema:schemaOf(d),saved:new Date(now0).toISOString(),data:d});
  const ok=await shareFile(txt,'leren-reservekopie-'+stamp()+'.json',t('bk.title').replace(/<[^>]*>/g,''));
  if(ok){S.lastBackup=now0;save();toast(tx('bk.saved'))}else toast(tx('bk.fail'));return ok}
/* tekst van een gekozen bestand -> {data, saved} of {err:sleutel}. Een kale opslag (bijv. de bewaarde onleesbare gegevens) mag ook. */
function parseBackup(txt){const o=parseState(txt);if(o==null)return {err:'bk.err.read'};
  const d=o&&o.kind==='reservekopie'&&o.data?o.data:o,st=checkState(d);
  if(st==='broken')return {err:'bk.err.invalid'};if(st==='newer')return {err:'bk.err.newer'};
  const sv=o&&o.saved?Date.parse(o.saved):NaN;return {data:d,saved:Number.isNaN(sv)?null:sv}}
function writeRestored(d,keepAs,keepLink){let m;try{m=fillDefaults(migrate(JSON.parse(JSON.stringify(d))))}catch(e){return false}
  if(keepLink&&S){if(S.tl1off)m.tl1off=true;const v=Math.max(m.v2seen||0,S.v2seen||0);if(v)m.v2seen=v}
  const cur=rawStore(KEY);if(cur!=null&&!putStore(keepAs,cur))return false;return putStore(KEY,JSON.stringify(m))}
function pickFile(cb){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.style.display='none';
  i.onchange=()=>{const f=i.files&&i.files[0];i.remove();if(!f)return;const r=new FileReader();r.onload=()=>cb(String(r.result||''));r.onerror=()=>cb('');r.readAsText(f)};document.body.appendChild(i);i.click()}
const backupCard=()=>`<section class="card stack">${T('bk.title')}<p class="small">${T('bk.text')}</p><div class="note small">${T('bk.private')}</div>
  ${S.lastBackup?`<p class="small muted">${T('bk.last',{when:fmtWhen(S.lastBackup)})}</p>`:''}
  <div class="btn-row"><button class="btn btn-ghost" id="bksave">${T('bk.save')}</button>${STORE==='ok'?`<button class="btn btn-ghost" id="bkload">${T('bk.load')}</button>`:''}</div><div id="bkmsg"></div></section>`;
function bindBackup(){if($('#bksave'))$('#bksave').onclick=()=>exportBackup().then(ok=>{if(ok&&tab==='ik'&&!route)vMe()});
  if($('#bkload'))$('#bkload').onclick=()=>pickFile(txt=>{const r=parseBackup(txt),box=$('#bkmsg');if(!box)return;
    if(r.err){box.innerHTML=`<div class="note small" role="status">${T(r.err)}</div>`;return}
    box.innerHTML=`<div class="note stack-sm" role="status">${T('bk.confirm',{when:r.saved?fmtWhen(r.saved):l=>tr('bk.unknownDate',l)||''})}<div class="btn-row"><button class="btn btn-ghost" id="bkno">${T('bk.cancel')}</button><button class="btn btn-main" id="bkyes">${T('bk.do')}</button></div></div>`;
    $('#bkno').onclick=()=>{box.innerHTML=''};$('#bkyes').onclick=()=>{if(writeRestored(r.data,BAK,true))location.reload();else toast(tx('bk.fail'))}})}
/* herstelscherm: opslag onleesbaar of onbekend. Er is niets gewist; alles wat hier iets vervangt, bewaart eerst de onleesbare gegevens in BROKEN. */
function vRecover(){$('#nav').hidden=true;const braw=rawStore(BAK),bak=braw!=null&&checkState(parseState(braw))==='ok'?parseState(braw):null;
  paint(`<section class="card stack">${T('rec.title')}<p>${T('rec.text')}</p>
   ${bak?`<button class="btn btn-main" id="rbak">${T('rec.useBak')}</button><p class="small muted">${T('rec.bakInfo')}</p>`:`<p class="small muted">${T('rec.noBak')}</p>`}
   <button class="btn btn-ghost" id="rfile">${T('rec.file')}</button><div id="rmsg"></div>
   <button class="btn btn-ghost" id="rdown">${T('rec.download')}</button>
   <button class="linkish muted" id="rnew">${T('rec.startOver')}</button></section>`);
  if($('#rbak'))$('#rbak').onclick=()=>{if(writeRestored(bak,BROKEN))location.reload();else toast(tx('bk.fail'))};
  $('#rfile').onclick=()=>pickFile(txt=>{const r=parseBackup(txt);if(r.err){$('#rmsg').innerHTML=`<div class="note small" role="status">${T(r.err)}</div>`;return}if(writeRestored(r.data,BROKEN))location.reload();else toast(tx('bk.fail'))});
  $('#rdown').onclick=()=>shareFile(rawStore(KEY)||'','leren-opslag-onleesbaar-'+stamp()+'.json','').then(ok=>{if(!ok)toast(tx('bk.fail'))});
  $('#rnew').onclick=()=>{$('#rmsg').innerHTML=`<div class="note stack-sm" role="status">${T('rec.startOver.confirm')}<div class="btn-row"><button class="btn btn-ghost" id="rno">${T('bk.cancel')}</button><button class="btn btn-main" id="ryes">${T('rec.startOver.do')}</button></div></div>`;
    $('#rno').onclick=()=>{$('#rmsg').innerHTML=''};$('#ryes').onclick=()=>{const cur=rawStore(KEY);if(cur!=null&&!putStore(BROKEN,cur)){toast(tx('bk.fail'));return}try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}}
/* nieuwere opslag: niets opslaan; bijwerken of alleen bekijken */
function vNewer(){$('#nav').hidden=true;
  paint(`<section class="card stack">${T('newer.title')}<p>${T('newer.text')}</p><button class="btn btn-main" id="nreload">${T('newer.reload')}</button><button class="btn btn-ghost" id="nview">${T('newer.view')}</button></section>`);
  $('#nreload').onclick=()=>location.reload();$('#nview').onclick=()=>{if(S.onboarded)show('vandaag');else vOnboard()}}

/* ============ viering ============ */
function petals(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#petals'),x=c.getContext('2d'),dpr=window.devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement),col=['--apricot-fill','--mint-fill','--lilac-fill','--sky-fill'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:44},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,r:4+Math.random()*5,v:1.4+Math.random()*2.2,a:Math.random()*6,c:col[Math.floor(Math.random()*4)]}));
  let f=0;(function tick(){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.a+=.05)*1.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.beginPath();x.ellipse(0,0,p.r,p.r*.55,0,0,7);x.fill();x.restore()});if(++f<170)requestAnimationFrame(tick);else x.clearRect(0,0,innerWidth,innerHeight)})();
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
}

setThai(S.thai||'altijd');setSize(S.size||'normaal');applyLang();
if(STORE==='broken')vRecover();else if(STORE==='newer')vNewer();else if(S.onboarded)show('vandaag');else vOnboard();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}</script>
